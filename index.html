/* The dashboard. Tokens, type, nav, segments, stats, firm rows and the theme print-wipe come from the
   Rolodex (build 91) so the two read as one family. What is new: the print stage and its controls,
   the firm picker, the Titan instrument panel and the firm profile. */
:root{
  --paper:#FFFFFF; --paper2:#FAFAFA; --paper3:#F2F2F2;
  --ink:#111111; --ink2:#333333; --ink3:#595959; --ink4:#6B6B6B;
  --rule:#E4E4E4; --rule2:#CFCFCF;
  --orange:#FF4F00; --on-orange:#111111;
  --on-ink:#FFFFFF; --on-ink-dim:rgba(255,255,255,.72); --on-ink-rule:rgba(255,255,255,.35);
  --nav-bg:rgba(255,255,255,.97); --shade:17,17,17; --grain:17,17,17; --li:#0A66C2;
  --stage:#F4F4F2;
  color-scheme:light;
  /* the Rolodex type scale (its Build 76): label 11 mono caps · small 13 · secondary 14 · body 15.5 ·
     row title 16 · section 18 · lead 19 · block heading 24 · display. Hierarchies run one way. */
  --fs-label:11px; --fs-small:13px; --fs-sec:14px; --fs-body:15.5px; --fs-row:16px; --fs-sect:18px; --fs-lead:19px; --fs-block:24px;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1012; --paper2:#15161A; --paper3:#1D1F23;
    --ink:#ECECEC; --ink2:#D2D2D2; --ink3:#ABABAB; --ink4:#9A9A9A;
    --rule:#2A2C31; --rule2:#3D4046;
    --on-ink:#0F1012; --on-ink-dim:rgba(15,16,18,.72); --on-ink-rule:rgba(15,16,18,.35);
    --nav-bg:rgba(15,16,18,.95); --shade:0,0,0; --grain:255,255,255; --li:#3B8EDB;
    --stage:#141518;
    color-scheme:dark;
  }
}

  --ink:#ECECEC; --ink2:#D2D2D2; --ink3:#ABABAB; --ink4:#9A9A9A;
  --rule:#2A2C31; --rule2:#3D4046;
  --on-ink:#0F1012; --on-ink-dim:rgba(15,16,18,.72); --on-ink-rule:rgba(15,16,18,.35);
  --nav-bg:rgba(15,16,18,.95); --shade:0,0,0; --grain:255,255,255; --li:#3B8EDB;
  --stage:#141518;
  color-scheme:dark;
}
*{box-sizing:border-box}
::selection{background:var(--orange);color:var(--on-orange)}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:var(--paper)}
.bg .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(var(--grain),.055) 1px,transparent 1px);background-size:3px 3px}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}
.disp{font-weight:800;letter-spacing:-.04em;line-height:.94;text-wrap:balance}
.lab{font:700 12px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:10px;z-index:100;background:var(--ink);color:var(--on-ink);padding:10px 14px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}

/* ---------------------------------------------------------------- nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
.navin{display:flex;align-items:center;gap:14px;height:56px}
.mark{display:flex;align-items:baseline;gap:9px;font:700 17px/1 var(--sans);letter-spacing:-.02em;white-space:nowrap}
.mark i{display:block;width:5px;height:5px;border-radius:50%;background:var(--orange);transform:translateY(-7px)}
.mark span{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.navsp{flex:1}
.seg{display:flex;border:1px solid var(--rule2);border-radius:2px;overflow:hidden}
.seg button{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.seg button[aria-pressed="true"]:focus-visible,.seg button[aria-selected="true"]:focus-visible{outline-color:var(--on-ink)}
.seg.views{position:relative}
.vbead{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--orange);pointer-events:none;transition:transform .34s cubic-bezier(.3,.6,.2,1),width .34s cubic-bezier(.3,.6,.2,1)}
.thm{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule2);border-radius:2px;color:var(--ink);flex:none}
.thm:hover{border-color:var(--ink)}
.thm svg{transition:transform .38s cubic-bezier(.3,1.4,.5,1)}
.thm.turn svg{transform:rotate(180deg)}
.seg button:active,.thm:active,.pick>button:active,.tgl:active,.swb:active,.shb:active,.ib:active,.fn:active,.an:active{transform:translateY(1px) scale(.985)}

/* the firm picker */
.pick{position:relative;min-width:0;flex:0 1 auto}
.pick>button{display:flex;align-items:center;gap:10px;max-width:100%;border:1px solid var(--rule2);border-radius:2px;padding:8px 11px;background:var(--paper)}
.pick>button:hover{border-color:var(--ink)}
.pick>button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick .pk{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);flex:none}
.pick .pn{font:600 13px/1.1 var(--sans);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pick .car{font-size:8px;color:var(--ink3);flex:none}
.pmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:min(440px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink);border-radius:2px;box-shadow:0 14px 40px rgba(var(--shade),.16)}
.pmenu .pq{margin:8px;font:400 14px/1 var(--sans);color:var(--ink);background:var(--paper3);border:0;border-radius:2px;padding:10px 11px;outline:none}
.pmenu .pq:focus{box-shadow:inset 0 0 0 1px var(--ink)}
.pmenu .pmk{display:flex;gap:6px;padding:0 8px 8px}
.pmenu .pmk button{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule2);border-radius:99px;padding:6px 10px;color:var(--ink3)}
.pmenu .pmk button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pmenu .plist{overflow:auto;padding:0 4px 6px;border-top:1px solid var(--rule)}
.pmenu .pg{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 8px 6px}
.pmenu .po{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:8px;border-radius:2px}
.pmenu .po:hover,.pmenu .po.kb{background:var(--paper3)}
.pmenu .po[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--orange)}
.pmenu .po b{font:600 14px/1.25 var(--sans);letter-spacing:-.01em}
.pmenu .po s{text-decoration:none;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);align-self:center;white-space:nowrap}
.pmenu .po em{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu .po .rs{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:7px;vertical-align:2px}
.pmenu .pnone{padding:16px 8px;color:var(--ink3);font-size:13px}
.firmname{font:600 13px/1.1 var(--sans);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

@media(max-width:1060px){
  .navin{height:auto;padding-block:10px;flex-wrap:wrap;row-gap:10px}
  .seg.views{order:5;flex:1 0 100%}
  .seg.views button{flex:1}
}
@media(max-width:560px){.mark span{display:none}.pick .pk{display:none}}

/* scroll line under the nav */
.sline{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;z-index:2}
.sline .fill{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--orange);transform-origin:left center;transform:scaleX(0)}
.sline .head{position:absolute;top:-2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--orange);opacity:0;transition:opacity .2s}
.sline.on .head{opacity:1}
.sline.sweep .fill{animation:sweep .7s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* ---------------------------------------------------------------- page header */
header.top{padding:56px 0 30px}
@media(max-width:760px){header.top{padding:26px 0 20px}}
header.top h1{margin:10px 0 0;font-size:clamp(34px,5.4vw,72px);color:var(--ink3);max-width:20ch}
header.top h1 b{color:var(--ink);font-weight:700}
header.top .sub{margin:22px 0 0;max-width:62ch;font-size:15px;color:var(--ink2);line-height:1.62}
header.top .by{margin-top:18px;text-transform:none;letter-spacing:.04em;font-size:11px}
.fhead .by{margin-top:16px;text-transform:none;letter-spacing:.04em;font-size:11px}
.hero-copy{position:relative}
.pbead{position:absolute;height:3px;border-radius:2px;background:var(--orange);pointer-events:none;transform-origin:left center;z-index:2}
.pbead::after{content:"";position:absolute;top:-2.5px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}
.pbead.ltr::after{right:-4px}
.pbead.rtl::after{left:-4px}
.pbead.done{transition:opacity .45s ease;opacity:0}
.pbead.done::after{display:none}
.lyr{position:absolute;right:0;top:0;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-variant-numeric:tabular-nums;transition:opacity .4s ease}
.lyr b{color:var(--ink);font-weight:700}
.pre{opacity:0;transform:translateY(8px)}
.post{transition:opacity .42s ease,transform .42s cubic-bezier(.2,.7,.2,1)}
.bump{display:inline-block;animation:bump .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.tick{display:inline-block;animation:tick .38s ease-out}
@keyframes tick{0%{transform:translateY(-3px)}100%{transform:none}}
.mark i.beat{animation:beat .36s cubic-bezier(.3,1.5,.5,1)}
@keyframes beat{0%{transform:translateY(-7px) scale(1)}40%{transform:translateY(-7px) scale(2.2)}100%{transform:translateY(-7px) scale(1)}}

/* ---------------------------------------------------------------- the print stage */
.stage{position:relative;height:clamp(360px,58vh,640px);background:var(--stage);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab;opacity:0;transition:opacity .6s ease}
.stage.live canvas{opacity:1}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 42%,transparent 58%,rgba(20,14,8,.16) 100%);opacity:0;transition:opacity .6s ease}
.stage.live::after{opacity:1}
.stage canvas.grabbing{cursor:grabbing}
.stage canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.stage .st-k{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);pointer-events:none}
.stage .st-k i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink3)}
.stage.live .st-k i{background:var(--orange);border-color:var(--orange);animation:breathe 2.4s ease-in-out infinite}
.stage.live.paused .st-k i{background:transparent;border-color:var(--ink);animation:none}
.stage .st-k i.beat{animation:beat2 .36s cubic-bezier(.3,1.5,.5,1)}
@keyframes breathe{50%{opacity:.35}}
@keyframes beat2{40%{transform:scale(1.9)}}
.stage .st-h{position:absolute;right:14px;bottom:12px;font:500 11px/1.3 var(--mono);color:var(--ink3);pointer-events:none;text-align:right;max-width:60%}
.stage .st-f{position:absolute;right:14px;top:12px;margin:0;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--ink3);pointer-events:none;font-variant-numeric:tabular-nums}
.stage .st-p{position:absolute;left:14px;bottom:12px;max-width:min(440px,60%);font:600 13px/1.35 var(--sans);letter-spacing:-.01em;color:var(--ink);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.stage .st-p.on{opacity:1;transform:none}
.stage .st-p b{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.02em}
.stage.night .st-k,.stage.night .st-h{color:#9aa3b2}
.stage.night .st-p{color:#e8ecf2}
.stage .cover{position:absolute;inset:0;background:var(--stage);opacity:0;pointer-events:none;transition:opacity .42s ease}
.stage .cover.on{opacity:1}
.stage .still{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.stage .still img{max-width:min(560px,90%);max-height:70%;object-fit:contain}
.stage .still p{margin:0;max-width:52ch;font-size:13px;line-height:1.55;color:var(--ink3)}
.stage .still p b{display:block;font:700 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
@media(max-width:640px){.stage{height:clamp(300px,54svh,520px);margin:0 -16px}.stage .st-h{display:none}.stage .st-p{max-width:calc(100% - 28px)}}
/* a phone on its side: a short header so the print is on the first screen */
@media(max-height:500px) and (orientation:landscape){
  header.top{padding:14px 0 12px}
  header.top h1{font-size:clamp(22px,3.4vw,34px);max-width:none}
  header.top .sub,header.top .by{display:none}
  .stage{height:calc(100svh - 64px);min-height:260px}
}

/* controls under the stage */
.ctrls{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;padding:18px 0 4px}
.cg{display:flex;flex-direction:column;gap:8px;min-width:0}
.cg>.lab{font-size:11px;color:var(--ink3)}
.cg .row2{display:flex;gap:6px;flex-wrap:wrap}
.shb{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 11px 8px 9px;color:var(--ink3)}
.shb svg{width:18px;height:18px;flex:none}
/* five structures: the row wraps on a narrow screen, and each row fills its width */
#shapes{flex-wrap:wrap}
#shapes .shb{flex:1 1 auto;justify-content:center}
.swb{width:34px;height:34px;border-radius:2px;border:1px solid var(--rule2);padding:4px;background:var(--paper)}
.swb i{display:block;width:100%;height:100%;border-radius:1px;background:var(--sw)}
.swb[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swb:focus-visible,.tgl:focus-visible,.ib:focus-visible,.shb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.swname{font:500 13px/1 var(--sans);color:var(--ink3);align-self:center;margin-left:4px;min-width:9ch}
.tgl{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule2);border-radius:2px;padding:8px 11px 8px 9px;color:var(--ink2);background:var(--paper)}
.tgl svg{width:16px;height:16px;flex:none}
.tgl:hover{border-color:var(--ink);color:var(--ink)}
.tgl[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.tgl[aria-pressed="true"] svg{color:var(--orange)}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule2);border-radius:2px;color:var(--ink)}
.ib:hover{border-color:var(--ink)}
.ib svg{width:14px;height:14px}
.ib[disabled],.tgl[disabled],.swb[disabled],.shb[disabled]{opacity:.4;cursor:default}
.shline{margin:14px 0 0;font:500 var(--fs-row)/1.45 var(--sans);color:var(--ink);max-width:70ch}
.toynote{margin:12px 0 0;font-size:13px;line-height:1.55;color:var(--ink3);max-width:78ch}

/* ---------------------------------------------------------------- stats strip */
.stats{display:flex;flex-wrap:wrap;gap:0;margin:26px 0 0;border-top:1px solid var(--ink)}
.stat{flex:1 1 150px;padding:14px 16px 16px 0;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0}
.stat + .stat{padding-left:16px}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 38px/1 var(--sans);letter-spacing:-.04em;white-space:nowrap}
.stat b small{font:600 13px/1 var(--mono);letter-spacing:.02em;color:var(--ink3);margin-left:4px}
.stat span{display:block;margin-top:6px;font:500 14px/1.35 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2)}
.stat .src{margin-top:8px}
.stat.hot b{color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}
@media(max-width:640px){.stat{flex:1 1 45%;border-right:0;border-bottom:1px solid var(--rule);padding-left:0!important}}
@media(max-width:560px){.stat b{font-size:34px}}

/* ---------------------------------------------------------------- firm and ICON pages, from the Rolodex */
.tab{padding-bottom:80px}
.fhead{padding:34px 0 30px;border-bottom:1px solid var(--ink)}
.fhead h1{margin:14px 0 0;font-size:clamp(32px,5.4vw,66px)}
.fhead .kst{margin:16px 0 0;font:500 14px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2)}
.fhead .syn{margin-top:18px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;align-items:center}
.tag{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ink3);color:var(--on-ink);border-radius:99px;padding:7px 11px}
.tag.k{background:none;color:var(--ink);border:1px solid var(--ink);padding:6px 10px}
.tag.o{background:var(--orange);color:var(--on-orange)}
.tag.q{background:none;color:var(--ink3);border:1px solid var(--rule2)}
.row{display:grid;grid-template-columns:186px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--rule)}
.row>.body{min-width:0}
@media(max-width:720px){.row{grid-template-columns:1fr;gap:12px;padding:22px 0}}
.syn{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink2);max-width:74ch}
.syn.lead{font-size:18px;line-height:1.55;letter-spacing:-.012em;color:var(--ink);max-width:70ch}
.why{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.why li{display:grid;grid-template-columns:78px 1fr;gap:16px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.why li:first-child{border-top:0}
.vv{font:700 13px/1 var(--sans);letter-spacing:-.01em}
.vv.clear{color:var(--ink)}
.vv.partial{color:var(--ink2)}
.vv.fail{color:var(--ink3)}
.why li.inn .vv.clear{background:var(--orange);color:var(--on-orange);border-radius:2px;padding:3px 7px;display:inline-block;justify-self:start}
.why b{display:block;font:600 14px/1.35 var(--sans);margin-bottom:4px}
.why .tx{display:block;font-size:14px;line-height:1.6;color:var(--ink2)}
.p1{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.p1:first-child{border-top:0}
.p1.dec{background:var(--paper2);border-radius:3px;padding:14px 12px}
.p1 .nm{font:600 15px/1.3 var(--sans);letter-spacing:-.01em}
.p1 .rl{font-size:13px;color:var(--ink3);margin-top:2px}
.p1 .ev{grid-column:1/-1;font-size:13px;line-height:1.55;color:var(--ink3);border-left:2px solid var(--rule2);padding-left:11px;margin-top:2px}
.badge{display:inline-block;margin-left:9px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--rule2);border-radius:2px;padding:4px 6px;vertical-align:middle}
.icons{display:flex;gap:6px;align-items:center}
.ic{width:30px;height:30px;border:1px solid var(--rule2);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ic:hover{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.ic svg{width:15px;height:15px}
.ic.li:hover{background:var(--li);border-color:var(--li);color:#fff}
.pj{padding:14px 0;border-top:1px solid var(--rule)}
.pj:first-child{border-top:0}
.pj b{font:600 14.5px/1.35 var(--sans)}
.pj .d{font-size:14px;line-height:1.6;color:var(--ink2);margin-top:4px}
.pj .s{margin-top:8px;font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul.mini{list-style:none;margin:0;padding:0}
ul.mini li{padding:11px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.6;color:var(--ink2)}
ul.mini li:first-child{border-top:0}
ul.mini.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:2px 28px}
ul.mini.srcs li{border-top:0;padding:6px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
ul.mini.srcs .pth{flex-basis:100%;font:500 12px/1.35 var(--mono);color:var(--ink3);overflow-wrap:anywhere}
.dt{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink4);margin-right:9px}
blockquote{margin:0;font-size:19px;line-height:1.5;letter-spacing:-.012em;max-width:62ch}
blockquote footer{margin-top:12px;font:500 13px/1.45 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2)}
.src{display:inline-flex;align-items:center;gap:5px;font:500 13px/1.4 var(--sans);overflow-wrap:anywhere;min-width:0;max-width:100%;letter-spacing:0;text-transform:none;color:var(--ink2);border-bottom:1px solid var(--rule2)}
.src:hover{color:var(--ink);border-color:var(--ink)}
.src svg{width:10px;height:10px;flex:none}
.lnk{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule2);border-radius:99px;padding:6px 11px 6px 8px}
.lnk:hover{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.lnk svg{width:13px;height:13px;flex:none}
.facts{list-style:none;margin:0;padding:0}

.ax{stroke:var(--ink);stroke-width:1}

/* ---------------------------------------------------------------- the Titan tab: an instrument panel */

/* dials */

}

/* the record */

.rail .now::after{content:"";position:absolute;bottom:-5px;left:-5.5px;width:9px;height:9px;border-radius:50%;background:var(--orange);animation:breathe 2.4s ease-in-out infinite}
/* hairline rows, as the Rolodex; a planned item has a dashed rule, as its hollow dot on the rail */

ul.names{list-style:none;margin:0;padding:0}

@media(max-width:820px){.maps{grid-template-columns:1fr}}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 26px;margin-top:24px}

@media(min-width:720px){.pgp.wide{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;column-gap:26px;align-content:start}.pgp.wide>.lab{grid-column:1/-1}}
.pl{padding:11px 0;border-bottom:1px solid var(--rule);transition:box-shadow .15s,padding .15s}

.pl .dt{margin-left:8px}

.pl.on{box-shadow:inset 3px 0 0 var(--orange);padding-left:11px}

.db{padding:22px 0 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:14px;min-width:0}

.ev{list-style:none;margin:auto 0 0;padding:0}

.vbars{display:flex;gap:16px;align-items:flex-end;height:170px;padding-top:6px}

.hb span{font:600 13px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:10px;width:var(--w);background:var(--ink);transform-origin:left;transition:transform .9s cubic-bezier(.3,.6,.2,1) var(--d)}

@media(max-width:520px){.hb{grid-template-columns:104px minmax(0,1fr) auto}}
.rng .rb.own{fill:var(--ink)}
.stos{display:flex;gap:16px;flex-wrap:wrap}

ol.seq{list-style:none;margin:6px 0 0;padding:0;counter-reset:q}

<script>
const WGSL_SIM = "// Paste simulation. Jacobi XPBD over a chain of paste nodes, with viscoplastic creep and slump.\n// Units: metres, seconds, pascals. One dispatch per stage; the uniform slot is chosen per substep.\n\nstruct Node {\n  pos: vec3f, _f0: f32,\n  vel: vec3f, birth: f32,\n  rest: vec3f, layer: f32,\n  vol: f32, aspect: f32, tau0: f32, athix: f32,\n};\n\nstruct Aux {\n  nrm: vec2f, arc: f32, support: i32,\n  restLen: f32, w: f32, h: f32, flags: u32,\n  hNom: f32, sgn: f32, kind: f32, _p: f32,\n};\n\nstruct SimU {\n  time: f32, dt: f32, count: u32, activeStart: u32,\n  topY: f32, damping: f32, grabIndex: i32, grabOn: u32,\n  grabTarget: vec4f,      // xyz target, w = falloff in nodes\n  nozzle: vec4f,          // xyz tip, w = extruding\n  mat: vec4f,             // rho, g, kA, aspectNom\n  solve: vec4f,           // omega, maxCorrFrac, maxVel, friction\n  creep: vec4f,           // creepRate, yieldDisp, yieldStrain, etaEff\n  ray0: vec4f, ray1: vec4f,\n  reduceN: u32, groups: u32, freshAge: f32, _u: f32,\n};\n\nconst F_PREV: u32 = 1u;     // chained to the node before it\nconst F_BOND: u32 = 2u;     // knitted to its support\n\n@group(0) @binding(0) var<uniform> U: SimU;\n@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;\n@group(0) @binding(2) var<storage, read_write> aux: array<Aux>;\n@group(0) @binding(3) var<storage, read_write> predIn: array<vec4f>;\n@group(0) @binding(4) var<storage, read_write> predOut: array<vec4f>;\n@group(0) @binding(5) var<storage, read> layerStart: array<u32>;\n@group(0) @binding(6) var<storage, read_write> pickKey: array<atomic<u32>>;\n@group(0) @binding(7) var<storage, read_write> partials: array<f32>;\n\nfn tauY(n: Node) -> f32 {\n  let age = max(0.0, U.time - n.birth);\n  return n.tau0 + n.athix * age * (1.0 + age / 300.0);\n}\n// Dimensionless stiffness for the solver: yield stress over 1 kPa, times an elastic build-up with age.\n// Green paste gains stiffness much faster than it gains yield stress.\nfn stiff(n: Node) -> f32 {\n  let age = max(0.0, U.time - n.birth);\n  return tauY(n) / 1000.0 * (1.0 + age / 20.0);\n}\n// Cap nodes only shape the rounded bead ends when drawn; the paste physics ignores them.\nfn isCap(i: u32) -> bool { return aux[i].kind > 1.5; }\nfn linkedPrev(i: u32) -> bool { return (aux[i].flags & F_PREV) != 0u && !isCap(i - 1u); }\nfn linkedNext(i: u32) -> bool { return i + 1u < U.count && (aux[i + 1u].flags & F_PREV) != 0u && !isCap(i + 1u); }\nfn isBad(v: f32) -> bool { return (bitcast<u32>(v) & 0x7fffffffu) >= 0x7f800000u; }\n\nfn activeIndex(gid: u32) -> u32 { return U.activeStart + gid; }\n\n// ---------------------------------------------------------------------------------------------\n// Support lookup: the highest node in the two layers below whose bead overlaps this one in plan.\n@compute @workgroup_size(64)\nfn supportSearch(@builtin(global_invocation_id) g: vec3u) {\n  let i = select(activeIndex(g.x), g.x, U._u > 0.5);\n  if (i >= U.count || isCap(i)) { return; }\n  let n = nodes[i];\n  let L = u32(n.layer + 0.5);\n  if (L == 0u) { aux[i].support = -1; return; }\n  let lo = layerStart[max(L, 2u) - 2u];\n  let hi = min(layerStart[L], i);\n  let wi = aux[i].w;\n  let hi_i = aux[i].h;\n  var best = -1;\n  var bestTop = -1.0;\n  for (var j = lo; j < hi; j++) {\n    if (isCap(j)) { continue; }\n    let pj = nodes[j].pos;\n    let d = distance(pj.xz, n.pos.xz);\n    let reach = 0.5 * (wi + aux[j].w) * 0.92;\n    if (d > reach) { continue; }\n    let top = pj.y + 0.5 * aux[j].h;\n    if (top > n.pos.y + 0.9 * hi_i) { continue; }\n    if (top > bestTop) { bestTop = top; best = i32(j); }\n  }\n  aux[i].support = best;\n}\n\n// ---------------------------------------------------------------------------------------------\n// Predict: cross-section update (slump, ironing, sag), gravity, damping.\n// Cross-section update: ironing, self-weight sag, and Bingham slump under the column load.\nfn updateSection(i: u32, dt: f32, setPaste: bool) {\n  var n = nodes[i];\n  var a = aux[i];\n  let rho = U.mat.x; let grav = U.mat.y; let kA = U.mat.z; let rNom = U.mat.w;\n  let age = max(0.0, U.time - n.birth);\n  let ty = tauY(n);\n  // Length share of this node along the chain.\n  // Length share along the chain: current spacing for fresh paste (a pulled strand thins),\n  // rest spacing for set paste, which no longer stretches.\n  // Each node's volume was pumped over the segment behind it, so that segment sets its section.\n  var l = 0.003;\n  if (linkedPrev(i)) { l = select(distance(n.pos, nodes[i - 1u].pos), a.restLen, setPaste); }\n  else if (linkedNext(i)) { l = select(distance(n.pos, nodes[i + 1u].pos), aux[i + 1u].restLen, setPaste); }\n  let A0 = kA * rNom * a.hNom * a.hNom;\n  let A = clamp(n.vol / max(l, 0.0006), 0.25 * A0, 2.4 * A0);\n  // The extrudate leaves the round orifice and the head irons it to the bead section,\n  // then self-weight adds a few percent of sag.\n  let sag = clamp(0.9 * rho * grav * a.hNom / ty, 0.0, 0.15);\n  let rSag = rNom * (1.0 + sag);\n  var r = n.aspect;\n  if (r < rSag) {\n    let tIron = select(0.45, 0.12, age < 0.6);\n    r += (rSag - r) * min(1.0, dt / tIron);\n  }\n  // Column load from the layers stacked above, by their nominal heights (rest.y is the height the\n  // node was laid at), so a settling wall does not feed back into its own load estimate.\n  let sigmaV = rho * grav * (max(0.0, U.topY - n.rest.y) + 0.5 * a.h);\n  let excess = sigmaV / 1.7320508 - ty;\n  if (excess > 0.0) {\n    let rate = excess / U.creep.w;                 // strain rate, 1/s\n    r *= 1.0 + min(2.0 * rate * dt, 0.02 * max(1.0, dt * 240.0));\n  }\n  r = min(r, rNom / (0.45 * 0.45));                // height never below 0.45 of nominal\n  nodes[i].aspect = r;\n  aux[i].h = sqrt(A / (kA * r));\n  aux[i].w = r * aux[i].h;\n}\n\n// Predict: section update, gravity, damping. Active (fresh) nodes only.\n@compute @workgroup_size(64)\nfn integrate(@builtin(global_invocation_id) g: vec3u) {\n  let i = activeIndex(g.x);\n  if (i >= U.count || isCap(i)) { return; }\n  updateSection(i, U.dt, false);\n  let n = nodes[i];\n  var v = n.vel;\n  v.y -= U.mat.y * U.dt;\n  v *= exp(-U.damping * U.dt);\n  nodes[i].vel = v;\n  predIn[i] = vec4f(n.pos + v * U.dt, 0.0);\n}\n\n// Set layers are kinematic. Once a frame their sections still respond to the load above (slump),\n// and each layer is re-seated on its support, bottom up, one dispatch per layer.\n@compute @workgroup_size(64)\nfn section(@builtin(global_invocation_id) g: vec3u) {\n  let i = g.x;\n  if (i >= U.activeStart || isCap(i)) { return; }\n  updateSection(i, U.dt, true);\n}\n@compute @workgroup_size(64)\nfn stack(@builtin(global_invocation_id) g: vec3u) {\n  let k = U.reduceN;\n  let lo = layerStart[k];\n  let hi = min(layerStart[k + 1u], U.activeStart);\n  let i = lo + g.x;\n  if (i >= hi || isCap(i)) { return; }\n  var p = nodes[i].pos;\n  let a = aux[i];\n  var y = p.y;\n  // Set paste does not fall: it is re-seated only on the layer directly below, or on the bed.\n  if (k == 0u) {\n    y = 0.5 * a.h;\n  } else if (a.support >= 0) {\n    let s = u32(a.support);\n    let ps = nodes[s].pos;\n    let overlap = clamp((0.5 * (a.w + aux[s].w) - distance(p.xz, ps.xz)) / (0.5 * a.w), 0.0, 1.0);\n    let sl = u32(nodes[s].layer + 0.5);\n    if (overlap > 0.15 && sl + 1u == k) { y = ps.y + 0.5 * (aux[s].h + a.h) * 0.97; }\n  }\n  y = max(y, 0.5 * a.h);\n  p.y = y;\n  nodes[i].pos = p;\n  nodes[i].vel = vec3f(0.0);\n  predIn[i] = vec4f(p, 0.0);\n  predOut[i] = vec4f(p, 0.0);\n}\n\n// ---------------------------------------------------------------------------------------------\n// One Jacobi iteration, gather form: each node sums its own corrections and averages them.\n@compute @workgroup_size(64)\nfn solve(@builtin(global_invocation_id) g: vec3u) {\n  let i = activeIndex(g.x);\n  if (i >= U.count || isCap(i)) { return; }\n  let n = nodes[i];\n  let a = aux[i];\n  let x = predIn[i].xyz;\n  let S = stiff(n);\n  var acc = vec3f(0.0);\n  var cnt = 0.0;\n  let kChain = clamp(0.4 + 0.1 * S, 0.4, 0.95);\n  let hasPrev = linkedPrev(i);\n  let hasNext = linkedNext(i);\n  var xp = x; var xn = x;\n  if (hasPrev) {\n    xp = predIn[i - 1u].xyz;\n    let wj = select(0.0, 1.0, i - 1u >= U.activeStart);\n    let d = x - xp; let L = length(d);\n    if (L > 1e-7) { acc += -(kChain * (L - a.restLen) / (1.0 + wj)) * (d / L); cnt += 1.0; }\n  }\n  if (hasNext) {\n    xn = predIn[i + 1u].xyz;\n    let d = x - xn; let L = length(d);\n    if (L > 1e-7) { acc += -(kChain * (L - aux[i + 1u].restLen) / 2.0) * (d / L); cnt += 1.0; }\n  }\n  // Bend in plan against the rest shape, which creeps when the paste yields.\n  if (hasPrev && hasNext) {\n    let rp = nodes[i - 1u].rest; let rn = nodes[i + 1u].rest;\n    let b = x.xz - 0.5 * (xp.xz + xn.xz);\n    let br = n.rest.xz - 0.5 * (rp.xz + rn.xz);\n    let kB = clamp(0.06 * S, 0.03, 0.45);\n    acc += vec3f((br - b).x, 0.0, (br - b).y) * kB; cnt += 1.0;\n  }\n  // Plan anchor to the rest position.\n  let kAn = clamp(0.015 * S * S, 0.004, 0.6);\n  acc += vec3f(n.rest.x - x.x, 0.0, n.rest.z - x.z) * kAn; cnt += 1.0;\n\n  // Knit: once bonded, the bead is held against its support from both sides.\n  var yMin = -1.0;\n  if (a.support >= 0) {\n    let s = u32(a.support);\n    let xs = predIn[s].xyz;\n    let ws = aux[s].w; let hs = aux[s].h;\n    let dPlan = distance(x.xz, xs.xz);\n    let overlap = clamp((0.5 * (a.w + ws) - dPlan) / (0.5 * a.w), 0.0, 1.0);\n    if (overlap > 0.15) {\n      yMin = xs.y + 0.5 * (hs + a.h) * 0.97;\n      if ((a.flags & F_BOND) != 0u) { acc.y += (yMin - x.y) * 0.25 * overlap; cnt += 1.0; }\n    }\n  }\n  // The user's hand.\n  if (U.grabOn != 0u) {\n    let gi = U.grabIndex;\n    let di = abs(f32(i32(i) - gi));\n    let fall = exp(-(di * di) / max(U.grabTarget.w * U.grabTarget.w, 0.25));\n    if (fall > 0.02) {\n      let kD = clamp(0.6 / max(S, 0.5), 0.06, 0.6) * fall;\n      var tgt = U.grabTarget.xyz;\n      if (i32(i) != gi) { tgt = x + (U.grabTarget.xyz - predIn[u32(gi)].xyz) * fall; }\n      acc += (tgt - x) * kD; cnt += 1.0;\n    }\n  }\n  var dx = U.solve.x * acc / max(cnt, 1.0);\n  let lim = U.solve.y * a.hNom;\n  let dl = length(dx);\n  if (dl > lim) { dx *= lim / dl; }\n  var y = x + dx;\n  // Hard contacts, one-sided: rest on the support, stay above the bed.\n  if (yMin > 0.0 && y.y < yMin) { y.y = yMin; }\n  y.y = max(y.y, 0.5 * a.h);\n  predOut[i] = vec4f(y, 0.0);\n}\n\n// ---------------------------------------------------------------------------------------------\n// Velocities, friction, knit bonding, and plastic creep of the rest shape and rest length.\n@compute @workgroup_size(64)\nfn finalize(@builtin(global_invocation_id) g: vec3u) {\n  let i = activeIndex(g.x);\n  if (i >= U.count || isCap(i)) { return; }\n  var n = nodes[i];\n  var a = aux[i];\n  let dt = U.dt;\n  let x = predIn[i].xyz;\n  var v = (x - n.pos) / dt;\n  let vl = length(v);\n  if (vl > U.solve.z) { v *= U.solve.z / vl; }\n  let S = stiff(n);\n  // contact state\n  var inContact = x.y <= 0.5 * a.h + 2e-5;\n  if (a.support >= 0) {\n    let s = u32(a.support);\n    let xs = predIn[s].xyz;\n    let yMin = xs.y + 0.5 * (aux[s].h + a.h) * 0.97;\n    let dPlan = distance(x.xz, xs.xz);\n    if (x.y <= yMin + 0.03 * a.h && dPlan < 0.5 * (a.w + aux[s].w)) { inContact = true; a.flags |= F_BOND; }\n    if (x.y > yMin + 0.8 * a.h) { a.flags &= ~F_BOND; }\n  }\n  if (inContact) { v.x *= 1.0 - U.solve.w; v.z *= 1.0 - U.solve.w; }\n  // Bingham creep: beyond the yield displacement the rest shape follows the paste.\n  let d = x.xz - n.rest.xz;\n  let dL = length(d);\n  let dy = U.creep.y * (1.0 + 0.25 * S);\n  if (dL > dy) {\n    let k = min(1.0, dt * U.creep.x / max(S * S, 0.05));\n    n.rest = vec3f(n.rest.x + d.x * (1.0 - dy / dL) * k, n.rest.y, n.rest.z + d.y * (1.0 - dy / dL) * k);\n  }\n  // Rest length creep: a stretched filament thins instead of springing back.\n  if (linkedPrev(i)) {\n    let Lc = distance(x, predIn[i - 1u].xyz);\n    let e = (Lc - a.restLen) / a.restLen;\n    let ey = U.creep.z;\n    if (abs(e) > ey) {\n      let k = min(1.0, dt * U.creep.x / max(S * S, 0.05));\n      a.restLen += (Lc - a.restLen) * (1.0 - ey / abs(e)) * k;\n      a.restLen = clamp(a.restLen, 0.0008, 0.0068);\n    }\n  }\n  n.vel = v;\n  n.pos = x;\n  nodes[i] = n;\n  aux[i].flags = a.flags;\n  aux[i].restLen = a.restLen;\n}\n\n// ---------------------------------------------------------------------------------------------\n// Picking: the front-most node within reach of the view ray.\n@compute @workgroup_size(64)\nfn pick(@builtin(global_invocation_id) g: vec3u) {\n  let i = g.x;\n  if (i >= U.count || isCap(i)) { return; }\n  let c = nodes[i].pos;\n  let o = U.ray0.xyz; let dir = U.ray1.xyz;\n  let t = dot(c - o, dir);\n  if (t <= 0.0) { return; }\n  let dist = length(o + dir * t - c);\n  let r = 0.6 * max(aux[i].w, aux[i].h) + 0.0012;\n  if (dist > r) { return; }\n  let q = u32(clamp(t / 4.0, 0.0, 1.0) * 262143.0);\n  atomicMin(&pickKey[0], (q << 14u) | i);\n}\n\n// ---------------------------------------------------------------------------------------------\n// Readouts: kinetic energy of fresh paste, measured volume, extremes. Two-stage reduction.\nvar<workgroup> wsum: array<vec4f, 256>;\nvar<workgroup> wext: array<vec4f, 256>;\n\n@compute @workgroup_size(256)\nfn reduce1(@builtin(global_invocation_id) g: vec3u, @builtin(local_invocation_id) l: vec3u, @builtin(workgroup_id) w: vec3u) {\n  let i = g.x;\n  var s = vec4f(0.0);          // KE fresh, volume, fresh count, bad count\n  var e = vec4f(1e9, 0.0, 1e9, 0.0); // min bottom, max speed, min h ratio, max stretch\n  if (i < U.count) {\n    let n = nodes[i]; let a = aux[i];\n    let rho = U.mat.x; let kA = U.mat.z;\n    let age = U.time - n.birth;\n    let m = rho * n.vol;\n    let sp = length(n.vel);\n    if (age < U.freshAge) { s.x = 0.5 * m * sp * sp; s.z = 1.0; }\n    // same length share the section update uses, so the measured volume matches the model's\n    var l = 0.003;\n    if (linkedPrev(i)) { l = distance(n.pos, nodes[i - 1u].pos); }\n    else if (linkedNext(i)) { l = distance(n.pos, nodes[i + 1u].pos); }\n    s.y = select(kA * a.w * a.h * max(l, 0.0006), 0.0, a.kind > 1.5);\n    let bad = isBad(n.pos.x) || isBad(n.pos.y) || isBad(n.pos.z) || isBad(a.h) || !(a.h > 0.0) || !(a.w > 0.0);\n    s.w = select(0.0, 1.0, bad);\n    e.x = n.pos.y - 0.5 * a.h;\n    e.y = sp;\n    e.z = select(a.h / a.hNom, 1.0, a.kind > 1.5);\n    if (linkedPrev(i) && a.kind < 1.5) { e.w = distance(n.pos, nodes[i - 1u].pos) / max(a.restLen, 1e-6); }\n  }\n  wsum[l.x] = s; wext[l.x] = e;\n  workgroupBarrier();\n  var k = 128u;\n  loop {\n    if (k == 0u) { break; }\n    if (l.x < k) {\n      wsum[l.x] += wsum[l.x + k];\n      let o = wext[l.x + k]; let me = wext[l.x];\n      wext[l.x] = vec4f(min(me.x, o.x), max(me.y, o.y), min(me.z, o.z), max(me.w, o.w));\n    }\n    workgroupBarrier();\n    k = k >> 1u;\n  }\n  if (l.x == 0u) {\n    let b = w.x * 8u;\n    partials[b + 0u] = wsum[0].x; partials[b + 1u] = wsum[0].y; partials[b + 2u] = wsum[0].z; partials[b + 3u] = wsum[0].w;\n    partials[b + 4u] = wext[0].x; partials[b + 5u] = wext[0].y; partials[b + 6u] = wext[0].z; partials[b + 7u] = wext[0].w;\n  }\n}\n\n@compute @workgroup_size(1)\nfn reduce2() {\n  var s = vec4f(0.0);\n  var e = vec4f(1e9, 0.0, 1e9, 0.0);\n  for (var k = 0u; k < U.groups; k++) {\n    let b = k * 8u;\n    s += vec4f(partials[b], partials[b + 1u], partials[b + 2u], partials[b + 3u]);\n    e = vec4f(min(e.x, partials[b + 4u]), max(e.y, partials[b + 5u]), min(e.z, partials[b + 6u]), max(e.w, partials[b + 7u]));\n  }\n  let o = 4096u;\n  partials[o] = s.x; partials[o + 1u] = s.y; partials[o + 2u] = s.z; partials[o + 3u] = s.w;\n  partials[o + 4u] = e.x; partials[o + 5u] = e.y; partials[o + 6u] = e.z; partials[o + 7u] = e.w;\n}\n";
const WGSL_GFX = "// Rendering: ring build, heightfield, dust, and the scene shaders (bead, section, bed, nozzle, dust, lines).\n\nstruct Node {\n  pos: vec3f, _f0: f32,\n  vel: vec3f, birth: f32,\n  rest: vec3f, layer: f32,\n  vol: f32, aspect: f32, tau0: f32, athix: f32,\n};\nstruct Aux {\n  nrm: vec2f, arc: f32, support: i32,\n  restLen: f32, w: f32, h: f32, flags: u32,\n  hNom: f32, sgn: f32, kind: f32, mixc: f32,\n};\nstruct Vert { p: vec4f, n: vec4f, t: vec4f, c: vec4f, m: vec4f };\nstruct Dust { p: vec4f, v: vec4f };\nstruct Box { c: vec4f, a: vec4f, b: vec4f, n: vec4f };   // centre + group, half axes, delay, material\nstruct Hail { p: vec4f, v: vec4f };                      // position + radius, velocity + life\n\nstruct FrameU {\n  viewProj: mat4x4f,\n  invViewProj: mat4x4f,\n  lightVP: mat4x4f,\n  cam: vec4f,        // xyz, sim time\n  keyDir: vec4f,     // towards the light, intensity\n  keyCol: vec4f,     // rgb, exposure\n  skyCol: vec4f,     // rgb, intensity\n  paper: vec4f,      // backdrop rgb (display space), dark flag\n  floorCol: vec4f,   // linear rgb, roughness\n  albedo: vec4f,     // mortar linear rgb, set roughness\n  wetP: vec4f,       // wet darken, green darken, wet roughness, sheen\n  soak: vec4f,       // warm glow rgb, amount\n  clipP: vec4f,      // plane point, on\n  clipN: vec4f,      // plane normal, cable radius\n  nozzle: vec4f,     // tip xyz, orifice radius\n  sway: vec4f,       // hose sway xyz, extruding\n  hf: vec4f,         // heightfield origin x, z, size; the first ring to rebuild this frame\n  misc: vec4f,       // show mesh, count, viewport w, viewport h\n  flexC: vec4f,      // flex centre, radius\n  flexX: vec4f,      // flex displacement, 0\n  mat2: vec4f,       // pinhole density, mix variation, layer tint, bed tint\n  dust: vec4f,       // dt, spawn start, spawn count, 0\n  tint: vec4f,       // accent rgb (linear), 0\n  pal: array<vec4f, 4>, // paste colours by mix id (linear rgb)\n  night: vec4f,      // amount 0..1, lamp intensity, fireflies 0..1, 0\n  lamp: vec4f,       // light tower lamp position, cone cos\n  lampDir: vec4f,    // lamp aim, 0\n  form: vec4f,       // formwork clock s (grows while shown, falls while hidden), shown, 0, 0\n  tower: vec4f,      // tower clock s, shown, 0, 0\n  hail: vec4f,       // on, spawn start, spawn count, dt\n  skyZen: vec4f,     // sky at the zenith (display rgb), 0\n  skyHor: vec4f,     // sky at the horizon (display rgb), rose band amount\n  sunCol: vec4f,     // glow toward the sun (display rgb), strength\n};\n\nconst PI: f32 = 3.14159265;\nconst R: u32 = 16u;          // segments around a bead ring (R + 1 vertices, the seam is duplicated)\nconst RV: u32 = 17u;\nconst F_PREV: u32 = 1u;\n\n@group(0) @binding(0) var<uniform> F: FrameU;\n\n// ------------------------------------------------------------------------------------ noise\nfn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nfn hash13(p: vec3f) -> f32 { var p3 = fract(p * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }\nfn hash22(p: vec2f) -> vec2f { var p3 = fract(vec3f(p.xyx) * vec3f(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }\nfn vnoise3(p: vec3f) -> f32 {\n  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);\n  let a = hash13(i); let b = hash13(i + vec3f(1, 0, 0)); let c = hash13(i + vec3f(0, 1, 0)); let d = hash13(i + vec3f(1, 1, 0));\n  let e = hash13(i + vec3f(0, 0, 1)); let f1 = hash13(i + vec3f(1, 0, 1)); let g = hash13(i + vec3f(0, 1, 1)); let h = hash13(i + vec3f(1, 1, 1));\n  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z);\n}\n// Value noise and its gradient in one pass: x = value, yzw = gradient. One set of eight corner hashes\n// in place of the six noise calls a central difference takes.\nfn vnoise3d(p: vec3f) -> vec4f {\ Out: texture_storage_2d<rgba16float, write>;\n\n// Paste colour from a node's packed mix code: from * 4 + to + blend.\nfn mixAlb(code: f32) -> vec3f {\n  let base = floor(code + 1e-4);\n  let bl = clamp(code - base, 0.0, 1.0);\n  let b = u32(base);\n  return mix(F.pal[min(b / 4u, 3u)].xyz, F.pal[b % 4u].xyz, bl);\n}\n\nfn flexOffset(p: vec3f) -> vec3f {\n  let d = p - F.flexC.xyz;\n  let w = exp(-dot(d, d) / (2.0 * F.flexC.w * F.flexC.w));\n  return F.flexX.xyz * w;\n}\nfn nodePos(i: u32) -> vec3f { let p = nodes[i].pos; return p + flexOffset(p); }\n// Cap nodes are placed from the paste next to them: a quarter and nearly half a bead width past the end.\nfn ringPos(r: u32, count: u32) -> vec3f {\n  let k = u32(aux[r].kind + 0.5);\n  if (k < 2u) { return nodePos(r); }\n  var base = i32(r); var other = i32(r); var f = 0.0;\n  if (k == 2u) { base = i32(r) + 1; other = i32(r) + 2; f = 0.25; }\n  if (k == 3u) { base = i32(r) + 2; other = i32(r) + 3; f = 0.45; }\n  if (k == 4u) { base = i32(r) - 1; other = i32(r) - 2; f = 0.25; }\n  if (k == 5u) { base = i32(r) - 2; other = i32(r) - 3; f = 0.45; }\n  let hiI = i32(count) - 1;\n  let b = u32(clamp(base, 0, hiI)); let o = u32(clamp(other, 0, hiI));\n  let pb = nodePos(b); let po = nodePos(o);\n  var d = pb - po; d.y = 0.0;\n  let l = length(d);\n  let dir = select(vec3f(0.0), d / max(l, 1e-6), l > 1e-6);\n  return pb + dir * f * aux[b].w;\n}\n\n// Superellipse point and normal for a cross-section. a, b half width and half height; e exponent.\nfn seP(c: f32, s: f32, e: f32) -> vec2f { return vec2f(sign(c) * pow(abs(c), 2.0 / e), sign(s) * pow(abs(s), 2.0 / e)); }\nfn seN(c: f32, s: f32, e: f32, a: f32, b: f32) -> vec2f {\n  let q = vec2f(sign(c) * pow(abs(c), 2.0 * (e - 1.0) / e) / a, sign(s) * pow(abs(s), 2.0 * (e - 1.0) / e) / b);\n  return normalize(q + vec2f(1e-9, 0.0));\n}\n\n@compute @workgroup_size(64)\nfn ringBuild(@builtin(global_invocation_id) g: vec3u) {\n  let r = g.x + u32(F.hf.w);\n  let count = u32(F.misc.y);\n  if (r >= count + 2u) { return; }\n  let extruding = F.sway.w > 0.5 && count > 0u;\n  var p: vec3f; var w: f32; var h: f32; var nrm2: vec2f; var arc: f32; var ageU: f32; var aspect: f32;\n  var prev: vec3f; var next: vec3f;\n  let last = count - 1u;\n  var alb = F.albedo.xyz;\n  let tip = F.nozzle.xyz;\n  let ro = F.nozzle.w;\n  if (r < count) {\n    let n = nodes[r]; let a = aux[r];\n    alb = mixAlb(a.mixc);\n    p = ringPos(r, count);\n    w = a.w; h = a.h; nrm2 = a.nrm; arc = a.arc; aspect = n.aspect;\n    ageU = max(0.0, F.cam.w - n.birth) * n.athix / 48.0;\n    prev = select(p, ringPos(r - 1u, count), (a.flags & F_PREV) != 0u);\n    if (r + 1u < count && (aux[r + 1u].flags & F_PREV) != 0u) { next = ringPos(r + 1u, count); }\n    else if (r == last && extruding) { next = mix(nodePos(last), tip, 0.5); }\n    else { next = p; }\n    // Rounded bead ends: cap nodes take their section from the paste next to them.\n    let kind = u32(a.kind + 0.5);\n    if (kind == 2u && r + 1u < count) { w = aux[r + 1u].w * 0.87; h = aux[r + 1u].h * 0.87; aspect = nodes[r + 1u].aspect; }\n    if (kind == 4u && r > 0u) { w = aux[r - 1u].w * 0.87; h = aux[r - 1u].h * 0.87; aspect = nodes[r - 1u].aspect; }\n    if (kind == 3u || kind == 5u) { w = 0.0; h = 0.0; }\n    if (kind == 3u || kind == 5u || kind == 2u || kind == 4u) { ageU = max(0.0, F.cam.w - n.birth) * n.athix / 48.0; }\n  } else {\n    // the extrudate neck: from the last node up into the orifice\n    let lp = nodePos(last); let la = aux[last];\n    alb = mixAlb(la.mixc);\n    nrm2 = la.nrm; arc = la.arc; ageU = 0.0; aspect = 1.0;\n    let f = select(1.0, 0.5, r == count);\n    p = mix(lp, tip, f);\n    if (r == count) { p.y -= 0.15 * (tip.y - lp.y); }\n    w = mix(la.w, 2.0 * ro, f); h = mix(la.h, 2.0 * ro, f);\n    prev = select(lp, p, r == count + 1u);\n    prev = select(prev, lp, r == count);\n    next = select(tip, tip + vec3f(0.0, 0.004, 0.0), r == count + 1u);\n    if (!extruding) { p = lp; w = 0.0; h = 0.0; prev = ampleCompareLevel(shadowMap, shadowSmp, uv + ro, z);\n  }\n  let s = sum / 10.0;\n  return mix(1.0, s, fade);\n}\n\nfn hfSampleT(t: texture_2d<f32>, sm: sampler, xz: vec2f) -> vec4f {\n  let uv = (xz - F.hf.xy) / F.hf.z;\n  if (any(uv < vec2f(0.0)) || any(uv > vec2f(1.0))) { return vec4f(0.0); }\n  return textureSampleLevel(t, sm, uv, 0.0);\n}\nfn skyVis(p: vec3f, n: vec3f) -> f32 { return skyVisT(hfTex, linSmp, p, n); }\n// Sky visibility from the heightfield: covered by the vault, and walls rising nearby.\nfn skyVisT(t: texture_2d<f32>, sm: sampler, p: vec3f, n: vec3f) -> f32 {\n  var occ = 0.0;\n  let here = hfSampleT(t, sm, p.xz);\n  let cover = here.x - p.y;\n  occ += 0.6 * smoothstep(0.004, 0.05, cover);\n  var hd = vec2f(n.x, n.z);\n  let hl = length(hd);\n  let bias = select(vec2f(0.0), hd / max(hl, 1e-4), hl > 0.2);\n  for (var k = 0; k < 6; k++) {\n    let a = f32(k) * 1.0472;\n    let d = normalize(vec2f(cos(a), sin(a)) + bias * 1.2 + vec2f(1e-4, 0.0));\n    for (var j = 0; j < 2; j++) {\n      let rr = select(0.016, 0.045, j == 1);\n      let hs = hfSampleT(t, sm, p.xz + d * rr);\n      let dh = select(hs.y, hs.z, j == 1) - p.y;\n      occ += 0.056 * clamp(dh / rr, 0.0, 1.6);\n    }\n  }\n  return clamp(1.0 - occ, 0.28, 1.0);\n}\n\n// A soft north window behind and above, plus the studio walls. Used for specular reflections.\nfn envLight(dir: vec3f, rough: f32) -> vec3f {\n  let up = dir.y;\n  let base = mix(F.skyHor.xyz * 0.5, F.skyCol.xyz * 0.95, smoothstep(-0.2, 0.6, up));\n  let wdir = normalize(vec3f(0.25, 0.62, -0.74));\n  let c = dot(dir, wdir);\n  let spread = mix(0.985, 0.80, rough);\n  let win = smoothstep(spread, mix(0.997, 0.93, rough), c);\n  return base * F.skyCol.w + F.skyCol.xyz * win * mix(4.5, 1.2, rough);\n}\n\n// The site at golden hour, in display space. skyBase is the gradient with the glow toward the sun's\n// azimuth and a faint rose band opposite it; skyAt adds a low, hazy band of trees and roofs on the horizon.\nfn skyBase(d: vec3f) -> vec3f {\n  let up = max(d.y, 0.0);\n  var c = mix(F.skyHor.xyz, F.skyZen.xyz, pow(smoothstep(0.0, 0.7, up), 0.65));\n  let sd = normalize(vec3f(F.keyDir.x, 0.0, F.keyDir.z));\n  let dh = normalize(vec3f(d.x, 0.0, d.z) + vec3f(1e-5, 0.0, 0.0));\n  let toward = max(dot(dh, sd), 0.0);\n  c += F.sunCol.xyz * F.sunCol.w * (0.35 * toward * toward + 0.65 * pow(toward, 8.0)) * exp(-up * 7.0);\n  let away = max(-dot(dh, sd), 0.0);\n  let band = smoothstep(0.01, 0.06, up) * (1.0 - smoothstep(0.08, 0.3, up));\n  c = mix(c, c * vec3f(1.04, 0.9, 0.93), away * band * 0.6 * F.skyHor.w);\n  return c;\n}\nfn skyAt(d: vec3f, px: vec2f) -> vec3f {\n  var c = skyBase(d);\n  // a little noise so the gradient does not band\n  let dn = (hash12(px) - 0.5) / 255.0;\n  if (d.y > 0.02) { return c + dn; }       // the treeline stands no higher than this\n  let az = atan2(d.z, d.x);\n  let q = vec2f(cos(az), sin(az));\n  let tree = 0.002 + 0.012 * smoothstep(0.25, 0.75, fbm2(q * 16.0 + 3.0)) + 0.003 * vnoise2(q * 140.0);\n  let cells = 160.0;\n  let cell = floor((az + PI) / (2.0 * PI) * cells);\n  let f = fract((az + PI) / (2.0 * PI) * cells);\n  let lot = hash12(vec2f(cell, 7.0));\n  let roof = step(0.62, lot) * step(0.18, f) * step(f, 0.82) * (0.006 + 0.004 * (1.0 - abs(f * 2.0 - 1.0)) + 0.002 * hash12(vec2f(cell, 2.0)));\n  let h = max(tree, roof);\n  if (d.y < h) {\n    let sil = mix(F.skyHor.xyz, F.skyZen.xyz, 0.3) * vec3f(0.83, 0.85, 0.9);\n    let k = 1.0 - smoothstep(h - 0.0015, h, d.y);\n    c = mix(c, sil, k * 0.42);\n  }\n  return c + dn;\n}\n\n// The light tower on the night shift: a warm spot aimed at the bed, falling off with distance.\nfn lampTerm(wp: vec3f, N: vec3f, V: vec3f, alb: vec3f, rough: f32, sh: f32) -> vec3f {\n  if (F.night.y <= 0.0) { return vec3f(0.0); }\n  let d = F.lamp.xyz - wp;\n  let dist = length(d);\n  let L = d / max(dist, 1e-4);\n  let cone = smoothstep(F.lamp.w, F.lamp.w + 0.1, dot(-L, F.lampDir.xyz));\n  let att = F.night.y * cone / (1.0 + dist * dist * 5.0);\n  let nl = max(dot(N, L), 0.0);\n  let H = normalize(L + V);\n  let a = max(rough * rough, 0.02);\n  let spec = D_ggx(max(dot(N, H), 0.0), a) * V_smith(max(dot(N, V), 1e-3), nl, a) * 0.04;\n  return (alb / PI + vec3f(spec)) * vec3f(1.0, 0.84, 0.62) * att * nl * sh;\n}\n\nfn D_ggxAniso(NoH: f32, ToH: f32, BoH: f32, at: f32, ab: f32) -> f32 {\n  let d = ToH * ToH / (at * at) + BoH * BoH / (ab * ab) + NoH * NoH;\n  return 1.0 / (PI * at * ab * d * d);\n}\nfn D_ggx(NoH: f32, a: f32) -> f32 { let a2 = a * a; let d = NoH * NoH * (a2 - 1.0) + 1.0; return a2 / (PI * d * d); }\nfn V_smith(NoV: f32, NoL: f32, a: f32) -> f32 {\n  let a2 = a * a;\n  let gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2);\n  let gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2);\n  return 0.5 / max(gv + gl, 1e-5);\n}\nfn F_schlick(f0: vec3f, VoH: f32) -> vec3f { return f0 + (vec3f(1.0) - f0) * pow(1.0 - VoH, 5.0); }\nfn D_charlie(NoH: f32, rough: f32) -> f32 {\n  let inv = 1.0 / rough; let cos2 = NoH * NoH; let sin2 = 1.0 - cos2;\n  return (2.0 + inv) * pow(sin2, inv * 0.5) / (2.0 * PI);\n}\n\n// ------------------------------------------------------------------------------------ bead\nstruct BeadOut {\n  @builtin(position) pos: vec4f,\n  @location(0) wp: vec3f,\n  @location(1) n: vec3f,\n  @location(2) t: vec3f,\n  @location(3) q: vec4f,    // age (wet to set), around the ring 0..1, arc length, ring index\n  @location(4) m: vec4f,    // colour, sky visibility\n};\n// the vault's cut: only what the section needs\nstruct BeadCutOut {\n  @builtin(position) pos: vec4f,\n  @location(0) wp: vec3f,\n  @location(4) m: vec4f,\n  @location(5) @interpolate(flat) center: vec3f,\n};\n\n@vertex\nfn beadVS(@location(0) p: vec4f, @location(1) n: vec4f, @location(2) t: vec4f, @location(3) c: vec4f, @location(4) m: vec4f) -> BeadOut {\n  var o: BeadOut;\n  o.pos = F.viewProj * vec4f(p.xyz, 1.0);\n  o.wp = p.xyz; o.n = n.xyz; o.t = t.xyz; o.q = vec4f(p.w, n.w, t.w, c.w); o.m = m;\n  return o;\n}\n@vertex\nfn beadCutVS(@location(0) p: vec4f, @location(3) c: vec4f, @location(4) m: vec4f) -> BeadCutOut {\n  var o: BeadCutOut;\n  o.pos = F.viewProj * vec4f(p.xyz, 1.0);\n  o.wp = p.xyz; o.m = m; o.center = c.xyz;\n  return o;\n}\n\nfn clipped(wp: vec3f) -> bool {\n  return F.clipP.w > 0.5 && wp.x > 0.0 && dot(wp - F.clipP.xyz, F.clipN.xyz) > 0.0;\n}\n\nfn mortarLight(wp: vec3f, N: vec3f, T: vec3f, V: vec3f, alb: vec3f, rough: f32, film: f32, sheen: f32, soakAmt: f32, ao: f32, skyV: f32) -> vec3f {\n  let L = normalize(F.keyDir.xyz);\n  let H = normalize(L + V);\n  let NoL = dot(N, L);\n  let NoV = max(dot(N, V), 1e-3);\n  let NoH = max(dot(N, H), 0.0);\n  let VoH = max(dot(V, H), 0.0);\n  let sh = shadowAt(wp, N);\n  let sky = skyV * ao;\n  let key = F.keyCol.xyz * F.keyDir.w;\n  let B = normalize(cross(N, T));\n  let Tn = normalize(cross(B, N));\n  let a = max(rough * rough, 0.004);\n  let at = a * 0.75; let ab = a * 1.3;          // highlights stretch across the drag grooves\n  let nl = max(NoL, 0.0);\n  // diffuse, with a little wrap for the wet paste\n  let wrap = 0.18 * film;\n  let dif = max((NoL + wrap) / (1.0 + wrap), 0.0);\n  var col = alb / PI * key * dif * sh;\n  // base specular (dielectric)\n  let f0 = vec3f(0.035);\n  let Dm = D_ggxAniso(NoH, dot(Tn, H), dot(B, H), at, ab);\n  let spec = Dm * V_smith(NoV, nl, a) * F_schlick(f0, VoH);\n  col += spec * key * nl * sh;\n  // water film on fresh paste: a tight, clear lobe\n  if (film > 0.001) {\n    let af = 0.045;\n    let sf = D_ggx(NoH, af) * V_smith(NoV, nl, af) * F_schlick(vec3f(0.02), VoH).x;\n    col += sf * key * nl * sh * film;\n  }\n  // dusty sheen on set paste\n  if (sheen > 0.001) {\n    let sc = D_charlie(NoH, 0.55) * 0.25 / max(4.0 * (nl + NoV - nl * NoV), 1e-3);\n    col += alb * 0.9 * sc * key * nl * sh * sheen;\n  }\n  // warm light soak past the terminator at thin wet edges\n  let beyond = clamp((NoL + 0.45) / 1.45, 0.0, 1.0) - nl;\n  let edge = pow(1.0 - NoV, 2.0);\n  col += F.soak.xyz * key * soakAmt * (0.8 * beyond + 0.35 * edge * nl) * mix(1.0, sh, 0.5);\n  // sky: diffuse and reflection\n  let skyD = F.skyCol.xyz * F.skyCol.w * (0.55 + 0.45 * N.y);\n  let bounce = F.floorCol.xyz * clamp(-N.y * 0.5 + 0.5, 0.0, 1.0) * (key * 0.12 + F.skyCol.xyz * F.skyCol.w * 0.35);\n  col += alb * (skyD * sky + bounce * mix(0.6, 1.0, sky));\n  let R = reflect(-V, N);\n  let fr = F_schlick(f0, NoV).x;\n  col += envLight(R, rough) * fr * sky * (1.0 - rough * 0.6) * 0.5;\n  // the water film mirrors the north window and the room: a clear coat over the paste\n  if (film > 0.001) { col += envLight(R, 0.04) * (0.035 + 0.965 * pow(1.0 - NoV, 5.0)) * film * mix(0.5, 1.0, sky) * 2.2; }\n  col += lampTerm(wp, N, V, alb, mix(rough, 0.08, film), sh);\n  return col;\n}\n\n// The paste, seen from outside. No discard here, so the GPU can reject hidden fragments before shading\n// them (on tile-based GPUs a discard anywhere in the shader turns that off); the vault's version clips.\nfn beadShade(i: BeadOut, gp: vec2f, fw: vec2f, fwA: f32, fwS: f32) -> vec4f {\n  let V = normalize(F.cam.xyz - i.wp);\n  var N = normalize(i.n);\n  let T = normalize(i.t);\n  let seed = i.q.w;\n\n  // Age: wet film first, then green, then set.\n  let wet = exp(-i.q.x);\n  let green = exp(-i.q.x * 0.1);\n  // Fine drag grooves run along the bead; a few trapped air pinholes.\n  let B = normalize(cross(N, T));\n  let aroundLen = i.q.y * 0.028;\n  let gv = sin(aroundLen * 2.0 * PI / 0.00055 + vnoise2(vec2f(i.q.z * 60.0, seed * 0.37)) * 6.0);\n  let groove = gv * 0.07 * (1.0 - 0.5 * wet) * (1.0 - smoothstep(0.25, 0.8, fwA / 0.00055));\n  N = normalize(N + B * groove);\n  // Sand grain in the paste: fine relief that the water film smooths over. The finest grain fades out\n  // once it is smaller than a pixel, and then costs nothing. (0.7: the gradient a central difference of\n  // half-width 0.35 gave.)\n  let gscale = 1.0 - smoothstep(0.00012, 0.0004, max(fwA, fwS));\n  var speck = 0.0;\n  if (gscale > 0.001) {\n    let g1 = vnoise3d(i.wp * 2600.0);\n    let gb = 0.7 * g1.yzw;\n    N = normalize(N - (gb - N * dot(gb, N)) * 0.55 * gscale * (1.0 - 0.75 * wet));\n    speck = g1.x - 0.5;\n  }\n  let g2 = vnoise3d(i.wp * 700.0);\n  let hb = 0.6 * g2.yzw;\n  N = normalize(N - (hb - N * dot(hb, N)) * 0.22 * (1.0 - 0.6 * wet));\n  var ao = 1.0;\n  let cellSz = vec2f(0.0011, 0.0011);\n  let cp = vec2f(i.q.z, aroundLen) / cellSz;\n  let ci = floor(cp);\n  let h = hash22(ci + vec2f(seed * 0.0, 3.1));\n  let pinVis = 1.0 - smoothstep(0.35, 0.9, max(fwS, fwA) / 0.0011);\n  if (h.x < F.mat2.x * select(0.0, 1.0, pinVis > 0.01)) {\n    let cc = ci + 0.25 + 0.5 * hash22(ci + 11.7);\n    let dd = length(cp - cc);\n    let rr = 0.12 + 0.16 * h.y;\n    if (dd < rr) {\n      let k = 1.0 - dd / rr;\n      ao *= mix(1.0, 0.35 + 0.65 * (1.0 - pinVis), smoothstep(0.0, 0.5, k));\n      let dv = cp - cc;\n      N = normalize(N - normalize(dv.x * T + dv.y * B + vec3f(1e-6)) * 0.6 * k * pinVis);\n    }\n  }\n  // the colour drift and the layer tint come with the vertex colour; the sand speckle is per pixel\n  var alb = i.m.xyz * (1.0 + 0.12 * speck * gscale);\n  alb *= 1.0 - F.wetP.y * green - F.wetP.x * wet;\n  var rough = mix(F.albedo.w, 0.7, green);\n  rough = mix(rough, F.wetP.z, wet);\n  let film = clamp(wet * 1.1 + green * 0.12, 0.0, 1.0);\n  let sheen = F.wetP.w * (1.0 - green);\n  let soakAmt = F.soak.w * (wet + 0.25 * green);\n  var col = mortarLight(i.wp, N, T, V, alb, rough, film, sheen, soakAmt, ao, i.m.w);\n  var outc = toDisplay(col);\n  if (F.misc.x > 0.5) {\n    // at a distance, draw every second or fourth ring so the mesh stays readable\n    let cellPx = 1.0 / max(max(fw.x, fw.y), 1e-4);\n    let st = select(select(4.0, 2.0, cellPx >= 2.5), 1.0, cellPx >= 5.0);\n    let g2 = gp / st; let f2 = fw / st;\n    let gl2 = min(fract(g2) / max(f2, vec2f(1e-4)), (1.0 - fract(g2)) / max(f2, vec2f(1e-4)));\n    let line = 1.0 - smoothstep(0.0, 1.1, min(gl2.x, gl2.y));\n    outc = mix(outc, vec3f(0.07), line * 0.7);\n  }\n  return vec4f(outc, 1.0);\n}\n\n// derivatives first, in uniform control flow\n@fragment\nfn beadFS(i: BeadOut) -> @location(0) vec4f {\n  let gp = vec2f(i.q.w, i.q.y * f32(R));\n  return beadShade(i, gp, fwidth(gp), fwidth(i.q.y) * 0.028, fwidth(i.q.z));\n}\n@fragment\nfn beadClipFS(i: BeadOut) -> @location(0) vec4f {\n  let gp = vec2f(i.q.w, i.q.y * f32(R));\n  let fw = fwidth(gp); let fwA = fwidth(i.q.y) * 0.028; let fwS = fwidth(i.q.z);\n  if (clipped(i.wp)) { discard; }\n  return beadShade(i, gp, fw, fwA, fwS);\n}\n\n// Seen from inside: the vault's saw cut. Shade the section plane and the cable in it.\n@fragment\nfn beadCutFS(i: BeadCutOut) -> @location(0) vec4f {\n  if (clipped(i.wp)) { discard; }\n  let V = normalize(F.cam.xyz - i.wp);\n  let rd = -V;\n  let t = dot(F.clipP.xyz - F.cam.xyz, F.clipN.xyz) / dot(rd, F.clipN.xyz);\n  let P = F.cam.xyz + rd * t;\n  var q = P - i.center;\n  q -= dot(q, F.clipN.xyz) * F.clipN.xyz;\n  let r = length(q);\n  let Nc = F.clipN.xyz;\n  let gr = vnoise3(P * 3000.0) * 0.5 + vnoise3(P * 900.0) * 0.5;\n  var alb = i.m.xyz * (1.02 + 0.10 * (gr - 0.5));\n  let course = u32(floor(i.center.y / 0.004 + 0.001));\n  let cr = select(0.0, F.clipN.w, course % 4u == 1u);\n  if (r < cr) {\n    // steel strand: seven wires read as a bright disc with a darker lay\n    let wires = 0.5 + 0.5 * cos(atan2(q.y, q.x + q.z) * 6.0);\n    let m = mix(vec3f(0.78, 0.78, 0.80), vec3f(0.5, 0.5, 0.52), wires * smoothstep(0.35 * cr, cr, r));\n    let L = normalize(F.keyDir.xyz);\n    let H = normalize(L + V);\n    let Nm = normalize(Nc + (q / max(r, 1e-6)) * 0.35 * (r / cr));\n    let nl = max(dot(Nm, L), 0.0);\n    let sp = D_ggx(max(dot(Nm, H), 0.0), 0.12) * 0.25 * F_schlick(m, max(dot(V, H), 0.0));\n    var col = (m * 0.25 * nl + sp * nl) * F.keyCol.xyz * F.keyDir.w * shadowAt(P + Nc * 0.004, Nc);\n    col += envLight(reflect(-V, Nm), 0.15) * m * 0.9 + m * F.skyCol.xyz * F.skyCol.w * 0.35;\n    return vec4f(toDisplay(col), 1.0);\n  }\n  let ring = select(1.0, smoothstep(cr, cr * 1.25, r), cr > 0.0);\n  alb *= mix(0.8, 1.0, ring);\n  // the cut face is open to the room: light it directly rather than through the bead's own shadow\n  let Lk = normalize(F.keyDir.xyz);\n  let nlc = max(dot(Nc, Lk), 0.0);\n  let shc = shadowAt(P + Nc * 0.004, Nc);\n  var col = alb / PI * F.keyCol.xyz * F.keyDir.w * nlc * shc;\n  col += alb * F.skyCol.xyz * F.skyCol.w * (0.55 + 0.45 * Nc.y) * 0.9;\n  col += alb * F.floorCol.xyz * 0.12 * F.keyDir.w * 0.3;\n  return vec4f(toDisplay(col), 1.0);\n}\n\n// Shadow pass for beads: depth only, honouring the cut.\nstruct ShOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f };\n@vertex\nfn beadShadowVS(@location(0) p: vec4f) -> ShOut {\n  var o: ShOut; o.pos = F.lightVP * vec4f(p.xyz, 1.0); o.wp = p.xyz; return o;\n}\n@fragment\nfn beadShadowFS(i: ShOut) { if (clipped(i.wp)) { discard; } }\n\n// ------------------------------------------------------------------------------------ bed and studio\nstruct FsOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };\n@vertex\nfn fsVS(@builtin(vertex_index) vi: u32) -> FsOut {\n  var o: FsOut;\n  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;\n  // at the far plane: the studio is drawn last and only where nothing else covers the pixel, so the\n  // depth test skips its shading under the print\n  o.pos = vec4f(p, 1.0, 1.0); o.ndc = p; return o;\n}\nstruct StudioOut { @location(0) c: vec4f };\n\nfn rayBox(o: vec3f, d: vec3f, bmin: vec3f, bmax: vec3f) -> vec2f {\n  let inv = 1.0 / d;\n  let t0 = (bmin - o) * inv; let t1 = (bmax - o) * inv;\n  let tmin = min(t0, t1); let tmax = max(t0, t1);\n  return vec2f(max(max(tmin.x, tmin.y), tmin.z), min(min(tmax.x, tmax.y), tmax.z));\n}\n\n@fragment\nfn studioFS(i: FsOut) -> StudioOut {\n  let fwN = fwidth(i.ndc.x);\n  let na = F.invViewProj * vec4f(i.ndc, 0.0, 1.0);\n  let nb = F.invViewProj * vec4f(i.ndc, 1.0, 1.0);\n  let o = F.cam.xyz;\n  let d = normalize(nb.xyz / nb.w - na.xyz / na.w);\n  var out: StudioOut;\n  var hitT = 1e9; var n = vec3f(0.0, 1.0, 0.0); var isBed = false;\n  let bb = rayBox(o, d, BED_MIN, BED_MAX);\n  if (bb.x < bb.y && bb.y > 0.0) {\n    hitT = max(bb.x, 0.0);\n    let p = o + d * hitT;\n    let c = (BED_MIN + BED_MAX) * 0.5; let e = (BED_MAX - BED_MIN) * 0.5;\n    let q = (p - c) / e;\n    let aq = abs(q);\n    if (aq.x > aq.y && aq.x > aq.z) { n = vec3f(sign(q.x), 0.0, 0.0); }\n    else if (aq.z > aq.y) { n = vec3f(0.0, 0.0, sign(q.z)); }\n    isBed = true;\n  }\n  if (!isBed && d.y < 0.0) { hitT = (FLOOR_Y - o.y) / d.y; }\n  if (hitT > 1e8) {\n    out.c = vec4f(skyAt(d, i.pos.xy), 1.0); return out;\n  }\n  let p = o + d * hitT;\n  let V = -d;\n  var alb = F.floorCol.xyz;\n  var rough = F.floorCol.w;\n  let fw = max(fwN * hitT * 0.6, 1e-5);\n  if (isBed) {\n    // the poured slab, steel-trowelled, with two saw-cut joints and chalk layout lines snapped around the print\n    let grey = dot(F.floorCol.xyz, vec3f(0.3333));\n    let bt = textureSampleLevel(bedTex, linSmp, (p.xz - BED_MIN.xz) / (BED_MAX.xz - BED_MIN.xz), 0.0);\n    alb = mix(F.floorCol.xyz, vec3f(grey), 0.45) * F.mat2.w * 1.04 * (0.97 + 0.06 * bt.x);\n    rough = 0.55;\n    let top = step(0.5, n.y);\n    let jd = min(abs(p.x - 0.0), abs(p.z + 0.016));\n    alb *= 1.0 - 0.16 * (1.0 - smoothstep(0.00012, 0.00012 + fw, jd)) * top;\n    let cx = min(abs(abs(p.x) - 0.14), 1.0);\n    let cz = min(abs(p.z + 0.13), abs(p.z - 0.104));\n    let cl = min(cx, cz);\n    let broken = 0.55 + 0.45 * bt.y;\n    let chalk = (1.0 - smoothstep(0.00035, 0.00035 + fw, cl)) * broken * top;\n    var dust = 0.0;\n    if (cl < 0.0022) { dust = (1.0 - smoothstep(0.0, 0.0022, cl)) * 0.25 * vnoise2(p.xz * 900.0) * top; }\n    alb = mix(alb, vec3f(0.26, 0.38, 0.66), clamp(chalk * 0.9 + dust, 0.0, 1.0));\n    // soft arris on the slab edge\n    if (n.y < 0.5) { alb *= 0.9; }\n  } else {\n    // the site: compacted ground around the slab, with a surveyed grid that fades into the distance\n    let gt = textureSampleLevel(groundTex, mirSmp, p.xz / GROUND_EXT + 0.5, 0.0);\n    alb *= 0.6 + 0.8 * gt.x;\n    alb *= mix(vec3f(1.03, 1.0, 0.96), vec3f(0.97, 0.99, 1.02), gt.y);\n    let gs = 0.1;\n    let gg = abs(fract(p.xz / gs + 0.5) - 0.5) * gs;\n    let fw2 = max(fwN * hitT * 0.9, 1e-5);\n    let line = 1.0 - smoothstep(0.00025, 0.00025 + fw2, min(gg.x, gg.y));\n    let fade = smoothstep(0.16, 0.26, length(p.xz)) * (1.0 - smoothstep(0.3, 0.85, length(p.xz)));\n    alb *= 1.0 - 0.075 * line * fade;\n  }\n  let L = normalize(F.keyDir.xyz);\n  let key = F.keyCol.xyz * F.keyDir.w;\n  let sh = shadowAt(p, n);\n  // clamped at the edge: past the heightfield the ground's visibility is the edge's, nothing nearby\n  let auv = clamp((p.xz - F.hf.xy) / F.hf.z, vec2f(0.0), vec2f(1.0));\n  let ao2 = textureSampleLevel(aoTex, linSmp, auv, 0.0);\n  let sky = select(ao2.y, ao2.x, isBed && n.y > 0.5);\n  let nl = max(dot(n, L), 0.0);\n  let H = normalize(L + V);\n  let a = rough * rough;\n  var col = alb / PI * key * nl * sh;\n  col += D_ggx(max(dot(n, H), 0.0), a) * V_smith(max(dot(n, V), 1e-3), nl, a) * 0.04 * key * nl * sh;\n  col += alb * F.skyCol.xyz * F.skyCol.w * sky;\n  col += lampTerm(p, n, V, alb, rough, sh);\n  // distance haze into the horizon so the ground meets the sky without a seam\n  let dist = length(p.xz - vec2f(0.0, -0.02));\n  let haze = max(smoothstep(0.5, 3.0, dist) * 0.9, 1.0 - smoothstep(0.0, 0.12, -d.y));\n  var disp = toDisplay(col);\n  disp = mix(disp, skyBase(vec3f(d.x, 0.0, d.z)) * vec3f(0.97, 0.96, 0.95), haze);\n  out.c = vec4f(disp, 1.0);\n  return out;\n}\n\n// ------------------------------------------------------------------------------------ nozzle\nstruct NzOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) @interpolate(flat) mat: f32, @location(3) lp: vec3f };\nfn nozzleXform(p: vec3f, hose: f32) -> vec3f {\n  var q = p;\n  // the hose bends with the head's motion; the metal body stays rigid\n  let s = clamp((p.y - 0.064) / 0.5, 0.0, 1.0);\n  q += F.sway.xyz * (s * s) * hose;\n  return q + F.nozzle.xyz;\n}\n@vertex\nfn nozzleVS(@location(0) p: vec4f, @location(1) n: vec4f) -> NzOut {\n  var o: NzOut;\n  let hose = select(0.0, 1.0, p.w > 1.5 && p.w < 2.5);\n  let wp = nozzleXform(p.xyz, hose);\n  o.pos = F.viewProj * vec4f(wp, 1.0);\n  o.wp = wp; o.n = n.xyz; o.mat = p.w; o.lp = p.xyz;\n  return o;\n}\n@fragment\nfn nozzleFS(i: NzOut) -> @location(0) vec4f {\n  let V = normalize(F.cam.xyz - i.wp);\n  var N = normalize(i.n);\n  if (dot(N, V) < 0.0) { N = -N; }\n  let L = normalize(F.keyDir.xyz);\n  let H = normalize(L + V);\n  let key = F.keyCol.xyz * F.keyDir.w;\n  var base = vec3f(0.045, 0.046, 0.05); var rough = 0.42; var metal = 1.0;\n  if (i.mat > 0.5 && i.mat < 1.5) { base = vec3f(0.085, 0.086, 0.09); rough = 0.28; }       // machined\n  if (i.mat > 1.5 && i.mat < 2.5) { base = vec3f(0.028); rough = 0.62; metal = 0.0; }      // hose\n  if (i.mat > 2.5) { base = vec3f(0.01); rough = 0.8; metal = 0.0; }                       // orifice throat\n  // blasted finish: a fine speckle in the roughness\n  rough = clamp(rough + 0.06 * (vnoise3(i.lp * 900.0) - 0.5), 0.05, 1.0);\n  let a = rough * rough;\n  let nl = max(dot(N, L), 0.0);\n  let NoV = max(dot(N, V), 1e-3);\n  let f0 = mix(vec3f(0.04), base * 1.6 + 0.07, metal);\n  let sh = shadowAt(i.wp, N);\n  var col = (1.0 - metal) * base / PI * key * nl * sh;\n  col += D_ggx(max(dot(N, H), 0.0), a) * V_smith(NoV, nl, a) * F_schlick(f0, max(dot(V, H), 0.0)) * key * nl * sh;\n  let env = envLight(reflect(-V, N), rough);\n  col += env * F_schlick(f0, NoV) * mix(0.35, 0.8, metal);\n  col += (1.0 - metal) * base * F.skyCol.xyz * F.skyCol.w * 0.8;\n  col += lampTerm(i.wp, N, V, mix(base, vec3f(0.3), metal), rough, sh);\n  return vec4f(toDisplay(col), 1.0);\n}\n@vertex\nfn nozzleShadowVS(@location(0) p: vec4f) -> @builtin(position) vec4f {\n  let hose = select(0.0, 1.0, p.w > 1.5 && p.w < 2.5);\n  // the feed hose runs up out of the studio; its shadow stops a little above the head\n  var q = p.xyz;\n  if (hose > 0.5 && q.y > 0.13) { q = vec3f(0.0, 0.13, 0.0); }\n  return F.lightVP * vec4f(nozzleXform(q, hose), 1.0);\n}\n\n// ------------------------------------------------------------------------------------ dust\nstruct DustOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) a: f32, @location(2) lit: f32, @location(3) @interpolate(flat) fly: f32 };\n@vertex\nfn dustVS(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> DustOut {\n  var o: DustOut;\n  let d = dustR[ii];\n  var corners = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(1, 1), vec2f(-1, -1), vec2f(1, 1), vec2f(-1, 1));\n  let corner = corners[vi];\n  let life = d.p.w;\n  if (life <= 0.0) { o.pos = vec4f(2.0, 2.0, 2.0, 1.0); return o; }\n  if (ii >= 512u) {\n    // a firefly: a soft glowing dot that blinks on its own rhythm\n    let fwd2 = normalize(F.cam.xyz - d.p.xyz);\n    let rt2 = normalize(cross(vec3f(0.0, 1.0, 0.0), fwd2));\n    let up2 = cross(fwd2, rt2);\n    let sz = 0.0022;\n    o.pos = F.viewProj * vec4f(d.p.xyz + (rt2 * corner.x + up2 * corner.y) * sz, 1.0);\n    o.uv = corner;\n    let blink = pow(max(0.0, sin(F.night.w * (1.6 + 1.3 * d.v.w) + d.v.w * 40.0)), 3.0);\n    o.a = blink * smoothstep(0.0, 1.5, life) * F.night.x;\n    o.lit = 1.0; o.fly = 1.0;\n    return o;\n  }\n  o.fly = 0.0;\n  let size = 0.00018 + 0.00032 * d.v.w;\n  let fwd = normalize(F.cam.xyz - d.p.xyz);\n  let rt = normalize(cross(vec3f(0.0, 1.0, 0.0), fwd));\n  let up = cross(fwd, rt);\n  let wp = d.p.xyz + (rt * corner.x + up * corner.y) * size;\n  o.pos = F.viewProj * vec4f(wp, 1.0);\n  o.uv = corner;\n  o.a = smoothstep(0.0, 0.5, life) * smoothstep(3.2, 2.6, life) * 0.35;\n  o.lit = 0.6 + 0.4 * shadowAt(d.p.xyz, fwd);\n  return o;\n}\n@fragment\nfn dustFS(i: DustOut) -> @location(0) vec4f {\n  let r = length(i.uv);\n  if (i.fly > 0.5) {\n    let g = exp(-r * r * 9.0) * i.a;\n    let c = vec3f(0.85, 1.0, 0.35) * (g * 1.4) + vec3f(1.0) * pow(g, 4.0) * 0.6;\n    return vec4f(c, g * 0.15);\n  }\n  let a = (1.0 - smoothstep(0.3, 1.0, r)) * i.a;\n  let c = toDisplay(F.albedo.xyz * 0.9 * F.keyCol.xyz * F.keyDir.w * 0.35 * i.lit + F.skyCol.xyz * 0.2);\n  return vec4f(c * a, a);\n}\n\n// ------------------------------------------------------------------------------------ toolpath overlay\nstruct LnOut { @builtin(position) pos: vec4f, @location(0) a: f32, @location(1) dash: f32 };\n@vertex\nfn lineVS(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> LnOut {\n  var o: LnOut;\n  let a = pathPts[ii]; let b = pathPts[ii + 1u];\n  let pa = F.viewProj * vec4f(a.xyz, 1.0);\n  let pb = F.viewProj * vec4f(b.xyz, 1.0);\n  let vp = F.misc.zw;\n  let sa = pa.xy / pa.w * vp * 0.5; let sb = pb.xy / pb.w * vp * 0.5;\n  var dir = sb - sa; if (length(dir) < 1e-5) { dir = vec2f(1.0, 0.0); }\n  let nrm = normalize(vec2f(-dir.y, dir.x));\n  var corners = array<vec2f, 6>(vec2f(0, -1), vec2f(1, -1), vec2f(1, 1), vec2f(0, -1), vec2f(1, 1), vec2f(0, 1));\n  let corner = corners[vi];\n  let useB = corner.x > 0.5;\n  let base = select(pa, pb, useB);\n  let width = select(1.6, 1.0, a.w > 1.5) * max(1.0, vp.y / 900.0);\n  let offs = nrm * corner.y * width / vp * 2.0 * base.w;\n  o.pos = vec4f(base.xy + offs, 0.0, base.w);\n  o.pos.z = 0.0;\n  o.a = select(select(0.95, 0.4, a.w < 0.5), 0.3, a.w > 1.5);\n  o.dash = select(0.0, f32(ii) * 0.5 + corner.x * 0.5, a.w > 0.5 && a.w < 1.5);\n  if (a.w != b.w) { o.a = 0.0; }\n  return o;\n}\n@fragment\nfn lineFS(i: LnOut) -> @location(0) vec4f {\n  var a = i.a;\n  if (i.dash > 0.0 && fract(i.dash * 0.35) > 0.55) { a *= 0.25; }\n  return vec4f(F.tint.xyz * a, a);\n}\n\n// ------------------------------------------------------------------------------------ boxes: formwork and the light tower\nstruct BoxOut {\n  @builtin(position) pos: vec4f,\n  @location(0) wp: vec3f,\n  @location(1) n: vec3f,\n  @location(2) @interpolate(flat) mat: f32,\n  @location(3) lp: vec3f,\n  @location(4) hs: vec3f,\n};\n// The pieces pop in with a little overshoot, each after its own delay, and sink away when hidden.\nfn boxScale(bx: Box) -> f32 {\n  let clk = select(F.form, F.tower, bx.c.w > 0.5);\n  if (clk.y > 0.5) {\n    let k = clamp((clk.x - bx.a.w) / 0.42, 0.0, 1.0);\n    if (k <= 0.0) { return 0.0; }\n    let x = k - 1.0;\n    return 1.0 + 2.9 * x * x * x + 1.9 * x * x;\n  }\n  let k = clamp((clk.x - bx.a.w * 0.35) / 0.28, 0.0, 1.0);\n  return 1.0 - k * k;\n}\nfn boxCorner(vi: u32) -> array<vec3f, 2> {\n  let f = vi / 6u; let q = vi % 6u;\n  var uv = vec2f(-1.0, -1.0);\n  if (q == 1u) { uv = vec2f(1.0, -1.0); } else if (q == 2u || q == 4u) { uv = vec2f(1.0, 1.0); } else if (q == 5u) { uv = vec2f(-1.0, 1.0); }\n  let ax = f / 2u;\n  let sg = select(-1.0, 1.0, f % 2u == 0u);\n  var lc = vec3f(uv.x, uv.y, sg); var ln = vec3f(0.0, 0.0, sg);\n  if (ax == 0u) { lc = vec3f(sg, uv.x, uv.y); ln = vec3f(sg, 0.0, 0.0); }\n  if (ax == 1u) { lc = vec3f(uv.x, sg, uv.y); ln = vec3f(0.0, sg, 0.0); }\n  return array<vec3f, 2>(lc, ln);\n}\n@vertex\nfn boxVS(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> BoxOut {\n  var o: BoxOut;\n  let bx = boxes[ii];\n  let s = boxScale(bx);\n  if (s <= 0.001) { o.pos = vec4f(2.0, 2.0, 2.0, 1.0); return o; }\n  let cn = boxCorner(vi);\n  let lc = cn[0]; let ln = cn[1];\n  let A = bx.a.xyz; let B = bx.b.xyz; let C = bx.n.xyz;\n  let drop = vec3f(0.0, (1.0 - min(s, 1.0)) * 0.03, 0.0);\n  let wp = bx.c.xyz + (A * lc.x + B * lc.y + C * lc.z) * s + drop;\n  o.pos = F.viewProj * vec4f(wp, 1.0);\n  o.wp = wp;\n  o.n = normalize(normalize(A) * ln.x + normalize(B) * ln.y + normalize(C) * ln.z);\n  o.mat = bx.b.w;\n  o.hs = vec3f(length(A), length(B), length(C));\n  o.lp = lc * o.hs;\n  return o;\n}\n@fragment\nfn boxFS(i: BoxOut) -> @location(0) vec4f {\n  let V = normalize(F.cam.xyz - i.wp);\n  var N = normalize(i.n);\n  if (dot(N, V) < 0.0) { N = -N; }\n  let m = u32(i.mat + 0.5);\n  var alb = vec3f(0.56, 0.4, 0.23);   // plywood\n  var rough = 0.8; var emit = vec3f(0.0);\n  // grain runs along the long side of each piece\n  let along = select(i.lp.y, i.lp.x, i.hs.x > i.hs.y);\n  let across = select(i.lp.x, i.lp.y, i.hs.x > i.hs.y);\n  let grain = vnoise2(vec2f(along * 60.0, across * 900.0 + i.lp.z * 400.0));\n  if (m == 0u) {\n    alb *= 0.86 + 0.24 * grain;\n    // plywood edges and the face veneer's patches\n    let e = min(i.hs.x - abs(i.lp.x), i.hs.y - abs(i.lp.y));\n    alb *= mix(0.72, 1.0, smoothstep(0.0, 0.0012, e));\n  } else if (m <= 3u) {\n    alb = vec3f(0.68, 0.53, 0.33) * (0.9 + 0.2 * grain);\n    if (m == 3u) { alb *= 0.85; }\n  } else if (m == 4u) {\n    alb = vec3f(0.78, 0.46, 0.02); rough = 0.45;    // painted steel, site yellow\n  } else if (m == 5u) {\n    alb = vec3f(0.9); rough = 0.3;\n    emit = vec3f(1.0, 0.88, 0.66) * 6.0 * F.night.x;  // lamp face\n  } else {\n    alb = vec3f(0.05, 0.05, 0.055); rough = 0.5;\n  }\n  let L = normalize(F.keyDir.xyz);\n  let key = F.keyCol.xyz * F.keyDir.w;\n  let sh = shadowAt(i.wp, N);\n  let nl = max(dot(N, L), 0.0);\n  let H = normalize(L + V);\n  let a = rough * rough;\n  var col = alb / PI * key * nl * sh;\n  col += D_ggx(max(dot(N, H), 0.0), a) * V_smith(max(dot(N, V), 1e-3), nl, a) * 0.04 * key * nl * sh;\n  col += alb * F.skyCol.xyz * F.skyCol.w * (0.6 + 0.4 * N.y) * skyVis(i.wp, N);\n  col += lampTerm(i.wp, N, V, alb, rough, sh);\n  col += emit;\n  return vec4f(toDisplay(col), 1.0);\n}\n@vertex\nfn boxShadowVS(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> @builtin(position) vec4f {\n  let bx = boxes[ii];\n  let s = boxScale(bx);\n  if (s <= 0.001 || bx.b.w > 4.5) { return vec4f(2.0, 2.0, 2.0, 1.0); }\n  let lc = boxCorner(vi)[0];\n  let wp = bx.c.xyz + (bx.a.xyz * lc.x + bx.b.xyz * lc.y + bx.n.xyz * lc.z) * s;\n  return F.lightVP * vec4f(wp, 1.0);\n}\n\n// --------------------------------------------------------- class Labyrinth extends Parts {
  constructor(o = {}) {

    const ring = (i) => ({ top: this.H, at: arcAt(0, this.zc, R[i], gapAt[i] + half(R[i]), gapAt[i] + 2 * Math.PI - half(R[i])) });

class Amphitheater extends Parts {
  constructor(o = {}) {

function finishPath(p) {

  p.s = s; p.len = s[s.length - 1];

}

function buildLayerPath(shape, layer, yC, dir, w, rg) {

  const N = rg ? Math.max(24, Math.round((shape.samples * (u1 - u0)) / 2)) : shape.samples;
  const pts = [], nrm = [], us = [];
  for (let i = 0; i <= N; i++) {

    const u = dir > 0 ? u0 + (u1 - u0) * t : u1 - (u1 - u0) * t;
    const [x, z] = shape.plan(yC, u, layer);
    pts.push([x, yC, z]); nrm.push(shape.normal(yC, u)); us.push(u);

function samplePath(p, d) {

  const f = (d - s[lo]) / (s[hi] - s[lo] || 1);

  reset() {

    this.activeStart = 0;
    this.grab = null;
    this.lastPos = null;

  writeNodes(recs) {

  fillSlot(s, sub) {

  afterSubmit() {

const DT = 1 / 240;

class Core {

    this.dev = device;

    this.pr.maxLayers = opts.maxLayers || 0;

    this.acc = 0;
    this.timeScale = 1;
    this.paused = false;

    this.fastTarget = -1;
    this.maxSub = 8;

  }

      r.aspect = PHYS.aspect * (1 + sag);

    this.events.length = 0;
  }

  setMix(s) { this.pr.params.mix = s; }

  beginGrab(index, hit) {
