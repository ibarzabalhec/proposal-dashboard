class OrbitCam {
  constructor() {
    this.home = { az: 0.62, el: 0.26, dist: 0.78, target: [0.004, 0.072, -0.01] };
    this.az = this.home.az; this.el = this.home.el; this.dist = this.home.dist; this.target = this.home.target.slice();
    this.fov = (30 * Math.PI) / 180;
    this.shift = [0, 0];     // lens shift in NDC
    this.aspect = 1;
    this.vel = [0, 0];
    this.update();
  }
  clampState() {
    this.el = clamp(this.el, 0.02, 1.35);
    this.dist = clamp(this.dist, 0.1, 2.4);
    this.target[1] = clamp(this.target[1], 0.0, 0.3);
    this.target[0] = clamp(this.target[0], -0.3, 0.3);
    this.target[2] = clamp(this.target[2], -0.3, 0.3);
  }
  get eye() {
    const ce = Math.cos(this.el);
    const e = [this.target[0] + this.dist * ce * Math.sin(this.az), this.target[1] + this.dist * Math.sin(this.el), this.target[2] + this.dist * ce * Math.cos(this.az)];
    e[1] = Math.max(e[1], 0.003);
    return e;
  }
  update() {
    this.clampState();
    const eye = this.eye;
    this.view = M4.lookAt(eye, this.target, [0, 1, 0]);
    this.proj = M4.perspective(this.fov, this.aspect, 0.004, 12, this.shift[0], this.shift[1]);
    this.viewProj = M4.mul(this.proj, this.view);
    this.invViewProj = M4.invert(this.viewProj);
    this.eyeP = eye;
    return { viewProj: this.viewProj, invViewProj: this.invViewProj, eye };
  }
  ray(ndcX, ndcY) {
    const a = M4.xform(this.invViewProj, [ndcX, ndcY, 0]);
    const b = M4.xform(this.invViewProj, [ndcX, ndcY, 1]);
    const pa = [a[0] / a[3], a[1] / a[3], a[2] / a[3]], pb = [b[0] / b[3], b[1] / b[3], b[2] / b[3]];
    return [this.eyeP, V3.norm(V3.sub(pb, pa))];
  }
  project(p) {
    const c = M4.xform(this.viewProj, p);
    return [c[0] / c[3], c[1] / c[3], c[3]];
  }
}



function buildNozzleMesh(ro) {
  const out = [];
  const SEG = 64;
  const push = (p, n, m) => { out.push(p[0], p[1], p[2], m, n[0], n[1], n[2], 0); };

  const prof = [
    [ro * 0.9, 0.006, 3, 0, 1], [ro * 1.0, 0.0002, 3, 0, 1],
    [ro, 0.0, 0, 0, 1], [ro + 0.001, 0.0, 0, 0, 1], [ro + 0.0015, 0.0007, 0, 0, 1],
    [0.0056, 0.0045, 0, 0, 1], [0.0074, 0.0145, 0, 0, 1], [0.0076, 0.0152, 0, 0, 1],
    [0.0076, 0.0156, 1, 1, 1], [0.0096, 0.016, 1, 1, 1], [0.0096, 0.0205, 1, 1, 1], [0.009, 0.021, 1, 1, 1],
    [0.0086, 0.0212, 0, 0, 1], [0.0086, 0.0232, 0, 0, 1],
    [0.0146, 0.0236, 0, 5, 0.92], [0.0154, 0.0250, 0, 5, 0.92], [0.0154, 0.0470, 0, 5, 0.92], [0.0146, 0.0484, 0, 5, 0.92],
    [0.015, 0.0488, 1, 5, 0.92], [0.015, 0.0522, 1, 5, 0.92], [0.0082, 0.0528, 1, 5, 1],
    [0.0082, 0.0552, 1, 0, 1],
  ];
  const ringPt = (pr, a) => { const r = pr[0] * radial(pr[3], a); return [Math.cos(a) * r, pr[1], Math.sin(a) * r * pr[4]]; };
  for (let i = 0; i < prof.length - 1; i++) {
    const A = prof[i], B = prof[i + 1];
    const m = B[2] === A[2] ? A[2] : B[2];
    for (let s = 0; s < SEG; s++) {
      const a0 = (s / SEG) * Math.PI * 2, a1 = ((s + 1) / SEG) * Math.PI * 2;
      const p00 = ringPt(A, a0), p01 = ringPt(A, a1), p10 = ringPt(B, a0), p11 = ringPt(B, a1);
      const fn = (P0, P1, Q0) => {
        const u = V3.sub(P1, P0), v = V3.sub(Q0, P0);
        let n = V3.norm(V3.cross(v, u));
        if (Math.abs(V3.len(V3.cross(v, u))) < 1e-12) n = [0, B[1] > A[1] ? -1 : 1, 0];
        if (m === 3) n = V3.mul(n, -1);
        return n;
      };

      const nA = (a) => {
        const d = 1e-3;
        const t1 = V3.sub(ringPt(A, a + d), ringPt(A, a - d));
        const t2 = V3.sub(ringPt(B, a), ringPt(A, a));
        let n = V3.norm(V3.cross(t2, t1));
        if (!Number.isFinite(n[0]) || V3.len(V3.cross(t2, t1)) < 1e-14) n = [0, B[1] > A[1] ? -1 : 1, 0];

      };
      let n00, n01;
      if (A[3] === 1 && B[3] === 1) { n00 = n01 = fn(p00, p01, p10); } else { n00 = nA(a0); n01 = nA(a1); }
      push(p00, n00, m); push(p10, n00, m); push(p11, n01, m);
      push(p00, n00, m); push(p11, n01, m); push(p01, n01, m);
    }
  }

  const box = (cx, cz, hx, hz, y0, y1, mat) => {
    const c = [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]];
    for (let k = 0; k < 4; k++) {
      const a = c[k], b = c[(k + 1) % 4];
      const n = V3.norm([b[1] - a[1], 0, -(b[0] - a[0])]);
      const P = (q, y) => [cx + q[0], y, cz + q[1]];

  const path = [];
  for (let j = 0; j <= HL; j++) {
    const t = j / HL;

    path.push([-0.075 * k * k, y, -0.11 * k * k]);

  const frames = path.map((P, j) => {
    const Q = path[Math.min(j + 1, HL)], P0 = path[Math.max(j - 1, 0)];
    const T = V3.norm(V3.sub(Q, P0));

      const a0 = (s / HS) * Math.PI * 2, a1 = ((s + 1) / HS) * Math.PI * 2;

      push(p00, n00, 2); push(p11, n11, 2); push(p01, n01, 2);
    }
  }

  for (let s = 0; s < HS; s++) {
    const a0 = (s / HS) * Math.PI * 2, a1 = ((s + 1) / HS) * Math.PI * 2;
    const R0 = 0.0082;
    const P = (a, y) => [Math.cos(a) * R0, y, Math.sin(a) * R0];
    const n0 = [Math.cos(a0), 0, Math.sin(a0)], n1 = [Math.cos(a1), 0, Math.sin(a1)];
    push(P(a0, 0.0552), n0, 1); push(P(a0, 0.064), n0, 1); push(P(a1, 0.064), n1, 1);
    push(P(a0, 0.0552), n0, 1); push(P(a1, 0.064), n1, 1); push(P(a1, 0.0552), n1, 1);
    push([0, 0.064, 0], [0, 1, 0], 1); push(P(a0, 0.064), [0, 1, 0], 1); push(P(a1, 0.064), [0, 1, 0], 1);
  }
  return new Float32Array(out);
}



const LIGHT_TOWER = { base: [-0.24, -0.009, -0.17], height: 0.35, target: [0.0, 0.03, -0.01] };

function wallTop(shape, w) {
  let top = 0;
  for (let y = 0.002; y < shape.H + 0.03; y += 0.002) { if (shape.kind(y, w) !== 'wall') break; top = y; }
  return top;
}

function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

function buildFormwork(shape, h = 0.004) {
  const w = PHYS.aspect * h;
  const out = [];
  const rnd = mulberry(7);
  const gap = 0.0018, ply = 0.0008, band = 0.03, panelW = 0.03;
  const yTop = wallTop(shape, w);
  const rows = Math.ceil(yTop / band);
  const counts = { panels: 0, studs: 0, kickers: 0, shores: 0 };
  for (let j = 0; j < rows; j++) {
    const y0 = j * band, y1 = Math.min(yTop, y0 + band);
    if (y1 - y0 < 0.006) continue;
    const yc = (y0 + y1) / 2;

    for (const [r0, r1] of shape.strokes(yc, w)) {
    const N = 240, us = [], ss = [0];
    let prev = shape.plan(yc, r0, 0);
    for (let i = 0; i <= N; i++) {
      const u = r0 + (r1 - r0) * (i / N);
      const p = shape.plan(yc, u, 0);
      if (i) ss.push(ss[i - 1] + Math.hypot(p[0] - prev[0], p[1] - prev[1]));
      us.push(u); prev = p;
    }
    const len = ss[N];
    const cols = Math.max(1, Math.round(len / panelW));
    const uAt = (s) => { let k = 0; while (k < N - 1 && ss[k + 1] < s) k++; const f = (s - ss[k]) / Math.max(ss[k + 1] - ss[k], 1e-9); return us[k] + (us[k + 1] - us[k]) * f; };
    for (let c = 0; c < cols; c++) {
      const uA = uAt((c / cols) * len), uB = uAt(((c + 1) / cols) * len), uM = uAt(((c + 0.5) / cols) * len);
      const n = shape.normal(yc, uM);
      const pa = shape.plan(yc, uA, 0), pb = shape.plan(yc, uB, 0);
      const lo = shape.plan(y0, uM, 0), hi = shape.plan(y1, uM, 0);
      const delay = 0.08 + 0.55 * (j / Math.max(1, rows)) + 0.35 * (c / cols) + 0.06 * rnd();
      for (const side of [1, -1]) {
        const off = side * (w / 2 + gap + ply);
        const A = [(pb[0] - pa[0]) / 2, 0, (pb[1] - pa[1]) / 2];
        const B = [(hi[0] - lo[0]) / 2, (y1 - y0) / 2, (hi[1] - lo[1]) / 2];
        const nC = V3.norm(V3.cross(A, B));
        const outward = V3.dot(nC, [n[0] * side, 0, n[1] * side]) >= 0 ? nC : V3.mul(nC, -1);
        const ctr = [(pa[0] + pb[0]) / 2 + n[0] * off, yc, (pa[1] + pb[1]) / 2 + n[1] * off];
        out.push({ c: ctr, a: V3.mul(A, 0.985), b: V3.mul(B, 0.99), n: V3.mul(outward, ply), mat: 0, delay: delay + (side < 0 ? 0.05 : 0), group: 0 });

        const sc = V3.add(ctr, V3.mul(outward, ply + 0.0016));
        out.push({ c: sc, a: V3.mul(V3.norm(A), 0.0009), b: B, n: V3.mul(outward, 0.0016), mat: 1, delay: delay + 0.1, group: 0 });
        counts.studs++;
      }

      if (j === 0 && c % 3 === 1) {
        const yk = yTop * 0.62;
        const pk = shape.plan(yk, uM, 0), nk = shape.normal(yk, uM);
        const top = [pk[0] + nk[0] * (w / 2 + gap + 2 * ply + 0.0035), yk, pk[1] + nk[1] * (w / 2 + gap + 2 * ply + 0.0035)];
        const foot = [pa[0] + n[0] * 0.07, 0.0012, pa[1] + n[1] * 0.07];
        const mid = V3.lerp(foot, top, 0.5), axis = V3.mul(V3.sub(top, foot), 0.5);
        const side1 = V3.mul(V3.norm(V3.cross(axis, [0, 1, 0])), 0.0011);
        const side2 = V3.mul(V3.norm(V3.cross(axis, side1)), 0.0017);
        out.push({ c: mid, a: side1, b: axis, n: side2, mat: 2, delay: 0.95 + 0.25 * rnd(), group: 0 });
        counts.kickers++;
      }
    }
    }
  }

  if (shape.shores) {
    const base = shape.outline(0.002, 96, w).map((p) => [p[0], p[1]]);
    for (let x = -0.11; x <= 0.11; x += 0.026) {
      for (let z = -0.13; z <= 0.1; z += 0.026) {
        if (!pointInPoly(x, z, base)) continue;
        let yIn = 0;
        for (let y = 0.002; y < yTop + 0.01; y += 0.003) {
          const poly = shape.outline(y, 72, w).map((p) => [p[0], p[1]]);
          if (!pointInPoly(x, z, poly)) break;

          let near = 1;
          for (const p of poly) near = Math.min(near, Math.hypot(p[0] - x, p[1] - z));
          if (near < w * 0.7) break;

        }
        if (yIn < 0.05) continue;
        const hgt = yIn - 0.004;
        const delay = 1.05 + 0.3 * rnd();
        out.push({ c: [x, hgt / 2, z], a: [0.0012, 0, 0], b: [0, hgt / 2, 0], n: [0, 0, 0.0012], mat: 3, delay, group: 0 });
        out.push({ c: [x, hgt + 0.0007, z], a: [0.007, 0, 0], b: [0, 0.0007, 0], n: [0, 0, 0.007], mat: 0, delay: delay + 0.08, group: 0 });
        counts.shores++;
      }
    }
  }
  return { boxes: out, counts, pieces: out.length };
}

function buildTower() {
  const [bx, by, bz] = LIGHT_TOWER.base, H = LIGHT_TOWER.height;
  const out = [];
  out.push({ c: [bx, by + 0.008, bz], a: [0.03, 0, 0], b: [0, 0.008, 0], n: [0, 0, 0.018], mat: 6, delay: 0.0, group: 1 });

  const top = [bx, by + 0.016 + H, bz];
  const aim = V3.norm(V3.sub(LIGHT_TOWER.target, top));
  const right = V3.norm(V3.cross([0, 1, 0], aim));
  const up = V3.norm(V3.cross(aim, right));
  out.push({ c: V3.add(top, [0, 0.004, 0]), a: V3.mul(right, 0.026), b: [0, 0.0025, 0], n: V3.mul(V3.norm([aim[0], 0, aim[2]]), 0.003), mat: 4, delay: 0.3, group: 1 });
  for (const [i, j] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const c = V3.add(V3.add(top, V3.mul(right, i * 0.0135)), V3.add(V3.mul(up, 0.012 + j * 0.0085), V3.mul(aim, 0.004)));

  const lampPos = V3.add(V3.add(top, V3.mul(up, 0.012)), V3.mul(aim, 0.012));
  return { boxes: out, lamp: { pos: lampPos, target: LIGHT_TOWER.target } };
}

function mulberry(seed) {
  let s = seed >>> 0;

    this.aoTex = device.createTexture({ size: [128, 128], format: 'rgba16float', usage: T.STORAGE_BINDING | T.TEXTURE_BINDING, label: 'aoTex' });

    this.groundTex = device.createTexture({ size: [1024, 1024], format: 'rgba8unorm', usage: T.STORAGE_BINDING | T.TEXTURE_BINDING, label: 'ground' });
    this.bedTex = device.createTexture({ size: [512, 512], format: 'rgba8unorm', usage: T.STORAGE_BINDING | T.TEXTURE_BINDING, label: 'bed' });
    this.mirSmp = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'mirror-repeat', addressModeV: 'mirror-repeat' });
    this.ringValid = 0;          // rings [0, ringValid) are current; set paste only moves when the sim re-seats it
    this.hfDirty = true;
    this.dust = device.createBuffer({ size: (N_DUST + N_FLY) * 32, usage: B.STORAGE | B.COPY_DST, label: 'dust' });
    this.hail = device.createBuffer({ size: N_HAIL * 32, usage: B.STORAGE | B.COPY_DST | B.COPY_SRC, label: 'hail' });
    this.boxes = device.createBuffer({ size: MAX_BOXES * 64, usage: B.STORAGE | B.COPY_DST, label: 'boxes' });
    this.boxCount = 0;
    this.path = device.createBuffer({ size: 2048 * 16, usage: B.STORAGE | B.COPY_DST, label: 'path' });
    this.pathCount = 0;
    this.uni = device.createBuffer({ size: 1024, usage: B.UNIFORM | B.COPY_DST, label: 'frameU' });
    this.uf = new Float32Array(256);
    const smSize = opts.shadowSize || (this.mobile ? 1536 : 2048);

    this.shadow = device.createTexture({ size: [smSize, smSize], format: SHADOW_FMT, usage: T.RENDER_ATTACHMENT | T.TEXTURE_BINDING, label: 'shadow' });
    this.shadowView = this.shadow.createView();
    this.cmpSmp = device.createSampler({ compare: 'less', magFilter: 'linear', minFilter: 'linear' });
    this.linSmp = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
    const noz = buildNozzleMesh(Math.sqrt(core.pr.A0 / Math.PI));
    this.nozzleCount = noz.length / 8;
    this.nozzleBuf = device.createBuffer({ size: noz.byteLength, usage: B.VERTEX | B.COPY_DST, label: 'nozzle' });
    device.queue.writeBuffer(this.nozzleBuf, 0, noz);
    this.buildPipelines(opts.code);
    this.msaa = null; this.size = [0, 0];
    this.frame = 0;
    this.dustCursor = 0;
    this.preset = PRESETS.limestone;
    this.showMesh = false; this.showPath = false;
    this.skip = {};              // benchmark only: passes to leave out
    this.paper = [0.933, 0.933, 0.925]; this.dark = false;
    this.accent = [1.0, 0.31, 0.0];
  }

  buildPipelines(code) {
    const d = this.dev;
    const mod = d.createShaderModule({ code, label: 'gfx' });
    this.module = mod;
    const C = GPUShaderStage.COMPUTE, VS = GPUShaderStage.VERTEX, FS = GPUShaderStage.FRAGMENT;
    this.cBGL = d.createBindGroupLayout({ label: 'gfxC', entries: [
      { binding: 0, visibility: C, buffer: { type: 'uniform' } },
      { binding: 1, visibility: C, buffer: { type: 'read-only-storage' } },
      { binding: 2, visibility: C, buffer: { type: 'read-only-storage' } },
      { binding: 3, visibility: C, buffer: { type: 'storage' } },
      { binding: 4, visibility: C, buffer: { type: 'storage' } },
      { binding: 5, visibility: C, storageTexture: { access: 'write-only', format: 'rgba16float' } },
      { binding: 6, visibility: C, buffer: { type: 'storage' } },
      { binding: 7, visibility: C, buffer: { type: 'storage' } },
    ] });

    this.c2BGL = d.createBindGroupLayout({ label: 'gfxC2', entries: [
      { binding: 0, visibility: C, buffer: { type: 'uniform' } },
      { binding: 1, visibility: C, buffer: { type: 'read-only-storage' } },
      { binding: 2, visibility: C, buffer: { type: 'read-only-storage' } },
      { binding: 3, visibility: C, buffer: { type: 'storage' } },
      { binding: 9, visibility: C, texture: { sampleType: 'float' } },
      { binding: 10, visibility: C, sampler: { type: 'filtering' } },
      { binding: 11, visibility: C, storageTexture: { access: 'write-only', format: 'rgba16float' } },
    ] });
    this.sBGL = d.createBindGroupLayout({ label: 'scene', entries: [
      { binding: 0, visibility: VS | FS, buffer: { type: 'uniform' } },
      { binding: 1, visibility: VS | FS, texture: { sampleType: 'depth' } },
      { binding: 2, visibility: VS | FS, sampler: { type: 'comparison' } },
      { binding: 3, visibility: FS, texture: { sampleType: 'float' } },
      { binding: 4, visibility: FS, sampler: { type: 'filtering' } },
      { binding: 5, visibility: VS, buffer: { type: 'read-only-storage' } },
      { binding: 6, visibility: VS, buffer: { type: 'read-only-storage' } },
      { binding: 7, visibility: VS, buffer: { type: 'read-only-storage' } },
      { binding: 8, visibility: VS, buffer: { type: 'read-only-storage' } },
      { binding: 12, visibility: FS, texture: { sampleType: 'float' } },
      { binding: 15, visibility: FS, texture: { sampleType: 'float' } },
      { binding: 16, visibility: FS, texture: { sampleType: 'float' } },
      { binding: 17, visibility: FS, sampler: { type: 'filtering' } },
    ] });
    this.bakeBGL = d.createBindGroupLayout({ label: 'bake', entries: [
      { binding: 13, visibility: C, storageTexture: { access: 'write-only', format: 'rgba8unorm' } },
      { binding: 14, visibility: C, storageTexture: { access: 'write-only', format: 'rgba8unorm' } },
    ] });
    this.shBGL = d.createBindGroupLayout({ label: 'shadow', entries: [
      { binding: 0, visibility: VS | FS, buffer: { type: 'uniform' } },
      { binding: 7, visibility: VS, buffer: { type: 'read-only-storage' } },
      { binding: 8, visibility: VS, buffer: { type: 'read-only-storage' } },
    ] });
    const cl = d.createPipelineLayout({ bindGroupLayouts: [this.cBGL] });
    const cl2 = d.createPipelineLayout({ bindGroupLayouts: [this.c2BGL] });
    const clb = d.createPipelineLayout({ bindGroupLayouts: [this.bakeBGL] });
    const sl = d.createPipelineLayout({ bindGroupLayouts: [this.sBGL] });
    const hl = d.createPipelineLayout({ bindGroupLayouts: [this.shBGL] });

    const jobs = [];
    const cp = (e, layout = cl) => { const o = {}; jobs.push(d.createComputePipelineAsync({ layout, compute: { module: mod, entryPoint: e }, label: e }).then((pl) => { o.p = pl; })); return o; };
    const cps = { ring: cp('ringBuild', cl2), hfClear: cp('hfClear'), hfSplat: cp('hfSplat'), hfBlur: cp('hfBlur'), hfAO: cp('hfAO', cl2), dust: cp('dustUpdate'), hail: cp('hailUpdate'), groundBake: cp('groundBake', clb), bedBake: cp('bedBake', clb) };
    const sim = this.core.sim;
    this.cBG = d.createBindGroup({ layout: this.cBGL, entries: [
      { binding: 0, resource: { buffer: this.uni } },
      { binding: 1, resource: { buffer: sim.nodes } },
      { binding: 2, resource: { buffer: sim.aux } },
      { binding: 3, resource: { buffer: this.verts } },
      { binding: 4, resource: { buffer: this.hfA } },
      { binding: 5, resource: this.hfTex.createView() },
      { binding: 6, resource: { buffer: this.dust } },
      { binding: 7, resource: { buffer: this.hail } },
    ] });
    this.cBG2 = d.createBindGroup({ layout: this.c2BGL, entries: [
      { binding: 0, resource: { buffer: this.uni } },
      { binding: 1, resource: { buffer: sim.nodes } },
      { binding: 2, resource: { buffer: sim.aux } },
      { binding: 3, resource: { buffer: this.verts } },
      { binding: 9, resource: this.hfTex.createView() },
      { binding: 10, resource: this.linSmp },
      { binding: 11, resource: this.aoTex.createView() },
    ] });
    this.sBG = d.createBindGroup({ layout: this.sBGL, entries: [
      { binding: 0, resource: { buffer: this.uni } },
      { binding: 1, resource: this.shadowView },
      { binding: 2, resource: this.cmpSmp },
      { binding: 3, resource: this.hfTex.createView() },
      { binding: 4, resource: this.linSmp },
      { binding: 5, resource: { buffer: this.dust } },
      { binding: 6, resource: { buffer: this.path } },
      { binding: 7, resource: { buffer: this.boxes } },
      { binding: 8, resource: { buffer: this.hail } },
      { binding: 12, resource: this.aoTex.createView() },
      { binding: 15, resource: this.groundTex.createView() },
      { binding: 16, resource: this.bedTex.createView() },
      { binding: 17, resource: this.mirSmp },
    ] });
    this.bakeBG = d.createBindGroup({ layout: this.bakeBGL, entries: [
      { binding: 13, resource: this.groundTex.createView() },
      { binding: 14, resource: this.bedTex.createView() },
    ] });
    this.shBG = d.createBindGroup({ layout: this.shBGL, entries: [
      { binding: 0, resource: { buffer: this.uni } },
      { binding: 7, resource: { buffer: this.boxes } },
      { binding: 8, resource: { buffer: this.hail } },
    ] });

    const beadVB = [{ arrayStride: VSTRIDE, attributes: [0, 1, 2, 3, 4].map((i) => ({ shaderLocation: i, offset: i * 16, format: 'float32x4' })) }];
    const cutVB = [{ arrayStride: VSTRIDE, attributes: [0, 3, 4].map((i) => ({ shaderLocation: i, offset: i * 16, format: 'float32x4' })) }];
    const nzVB = [{ arrayStride: 32, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }, { shaderLocation: 1, offset: 16, format: 'float32x4' }] }];
    const ms = { count: 4 };
    const depth = (write, cmp) => ({ format: 'depth32float', depthWriteEnabled: write, depthCompare: cmp });
    const tgt = [{ format: this.format }];
    const blendT = [{ format: this.format, blend: { color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } } }];
    const rp = (o) => { const w = {}; jobs.push(d.createRenderPipelineAsync({ layout: sl, multisample: ms, ...o }).then((pl) => { w.p = pl; })); return w; };
    this.rp = {
      studio: rp({ vertex: { module: mod, entryPoint: 'fsVS' }, fragment: { module: mod, entryPoint: 'studioFS', targets: tgt }, primitive: { topology: 'triangle-list' }, depthStencil: depth(false, 'less-equal'), label: 'studio' }),

      beadCull: rp({ vertex: { module: mod, entryPoint: 'beadVS', buffers: beadVB }, fragment: { module: mod, entryPoint: 'beadFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'back' }, depthStencil: depth(true, 'less'), label: 'bead' }),
      beadClip: rp({ vertex: { module: mod, entryPoint: 'beadVS', buffers: beadVB }, fragment: { module: mod, entryPoint: 'beadClipFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'back' }, depthStencil: depth(true, 'less'), label: 'beadClip' }),
      beadBack: rp({ vertex: { module: mod, entryPoint: 'beadCutVS', buffers: cutVB }, fragment: { module: mod, entryPoint: 'beadCutFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'front' }, depthStencil: depth(true, 'less'), label: 'beadCut' }),
      nozzle: rp({ vertex: { module: mod, entryPoint: 'nozzleVS', buffers: nzVB }, fragment: { module: mod, entryPoint: 'nozzleFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: depth(true, 'less'), label: 'nozzle' }),
      dust: rp({ vertex: { module: mod, entryPoint: 'dustVS' }, fragment: { module: mod, entryPoint: 'dustFS', targets: blendT }, primitive: { topology: 'triangle-list' }, depthStencil: depth(false, 'less'), label: 'dust' }),
      line: rp({ vertex: { module: mod, entryPoint: 'lineVS' }, fragment: { module: mod, entryPoint: 'lineFS', targets: blendT }, primitive: { topology: 'triangle-list' }, depthStencil: depth(false, 'always'), label: 'line' }),
      box: rp({ vertex: { module: mod, entryPoint: 'boxVS' }, fragment: { module: mod, entryPoint: 'boxFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: depth(true, 'less'), label: 'box' }),
      hail: rp({ vertex: { module: mod, entryPoint: 'hailVS' }, fragment: { module: mod, entryPoint: 'hailFS', targets: tgt }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: depth(true, 'less'), label: 'hail' }),
    };
    const shp = (o) => { const w = {}; jobs.push(d.createRenderPipelineAsync({ layout: hl, ...o }).then((pl) => { w.p = pl; })); return w; };
    this.sp = {
      bead: shp({ vertex: { module: mod, entryPoint: 'beadShadowVS', buffers: [{ arrayStride: VSTRIDE, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] }] }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: SHADOW_FMT, depthWriteEnabled: true, depthCompare: 'less', depthBias: 2, depthBiasSlopeScale: 1.5 }, label: 'beadShadow' }),
      beadClip: shp({ vertex: { module: mod, entryPoint: 'beadShadowVS', buffers: [{ arrayStride: VSTRIDE, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] }] }, fragment: { module: mod, entryPoint: 'beadShadowFS', targets: [] }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: SHADOW_FMT, depthWriteEnabled: true, depthCompare: 'less', depthBias: 2, depthBiasSlopeScale: 1.5 }, label: 'beadShadowClip' }),
      nozzle: shp({ vertex: { module: mod, entryPoint: 'nozzleShadowVS', buffers: [{ arrayStride: 32, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] }] }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: SHADOW_FMT, depthWriteEnabled: true, depthCompare: 'less' }, label: 'nozzleShadow' }),
      box: shp({ vertex: { module: mod, entryPoint: 'boxShadowVS' }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: SHADOW_FMT, depthWriteEnabled: true, depthCompare: 'less', depthBias: 2, depthBiasSlopeScale: 1.5 }, label: 'boxShadow' }),
      hail: shp({ vertex: { module: mod, entryPoint: 'hailShadowVS' }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: SHADOW_FMT, depthWriteEnabled: true, depthCompare: 'less' }, label: 'hailShadow' }),
    };
    const rpw = this.rp, spw = this.sp;
    this.cp = {}; this.rp = {}; this.sp = {};
    this.ready = Promise.all(jobs).then(() => {
      for (const k in cps) this.cp[k] = cps[k].p;
      for (const k in rpw) this.rp[k] = rpw[k].p;
      for (const k in spw) this.sp[k] = spw[k].p;
      const enc = d.createCommandEncoder(), c = enc.beginComputePass({ label: 'bake' });
      c.setBindGroup(0, this.bakeBG);
      c.setPipeline(this.cp.groundBake); c.dispatchWorkgroups(128, 128);
      c.setPipeline(this.cp.bedBake); c.dispatchWorkgroups(64, 64);
      c.end();
      d.queue.submit([enc.finish()]);
    });
  }

  ensureTargets(w, h) {
    if (this.size[0] === w && this.size[1] === h && this.msaa) return;
    if (this.msaa) { this.msaa.destroy(); this.depth.destroy(); }
    this.size = [w, h];
    this.msaa = this.dev.createTexture({ size: [w, h], sampleCount: 4, format: this.format, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    this.depth = this.dev.createTexture({ size: [w, h], sampleCount: 4, format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    this.msaaView = this.msaa.createView(); this.depthView = this.depth.createView();
  }

  setPath(points) {

    const n = Math.min(points.length, 2048);
    const a = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) a.set(points[i], i * 4);
    this.dev.queue.writeBuffer(this.path, 0, a);
    this.pathCount = n;
  }

  setBoxes(list) {
    const n = Math.min(list.length, MAX_BOXES);
    const a = new Float32Array(n * 16);
    for (let i = 0; i < n; i++) {
      const b = list[i], o = i * 16;
      a[o] = b.c[0]; a[o + 1] = b.c[1]; a[o + 2] = b.c[2]; a[o + 3] = b.group;
      a[o + 4] = b.a[0]; a[o + 5] = b.a[1]; a[o + 6] = b.a[2]; a[o + 7] = b.delay;
      a[o + 8] = b.b[0]; a[o + 9] = b.b[1]; a[o + 10] = b.b[2]; a[o + 11] = b.mat;
      a[o + 12] = b.n[0]; a[o + 13] = b.n[1]; a[o + 14] = b.n[2]; a[o + 15] = 0;
    }
    this.dev.queue.writeBuffer(this.boxes, 0, a);
    this.boxCount = n;
  }

  lightMatrices(st) {
    const L = V3.norm([-0.64, 0.44, 0.63]);
    if (st && st.lampShadow) {
      const lp = st.lamp.pos, tgt = st.lamp.target;
      const view = M4.lookAt(lp, tgt, [0, 1, 0]);
      const proj = M4.perspective(1.25, 1, 0.08, 2.2, 0, 0);
      return { L, lightVP: M4.mul(proj, view) };
    }
    const c = [0, 0.06, -0.02];
    const eye = V3.add(c, V3.mul(L, 1.2));
    const view = M4.lookAt(eye, c, [0, 1, 0]);
    const e = 0.5;
    const proj = M4.ortho(-e, e, -e, e, 0.2, 2.8);
    return { L, lightVP: M4.mul(proj, view) };
  }

  fillUniforms(cam, st) {
    const u = this.uf, p = this.preset, core = this.core;
    const nt = st.night || 0;                  // 0 day .. 1 night
    u.set(cam.viewProj, 0); u.set(cam.invViewProj, 16);
    const { L, lightVP } = this.lightMatrices(st);
    u.set(lightVP, 32);
    let o = 48;
    const v4 = (a, b, c, d) => { u[o++] = a; u[o++] = b; u[o++] = c; u[o++] = d; };
    const mixc = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
    v4(cam.eye[0], cam.eye[1], cam.eye[2], core.pr.t);
    const kc = mixc(this.dark ? [1.0, 0.8, 0.63] : [1.0, 0.82, 0.62], [0.55, 0.65, 0.95], nt);
    v4(L[0], L[1], L[2], (this.dark ? 3.4 : 3.0) * (1 - 0.96 * nt));
    v4(kc[0], kc[1], kc[2], (this.dark ? 0.95 : 1.0) * (1 + 0.25 * nt));
    const sc = mixc(this.dark ? [0.52, 0.58, 0.78] : [0.72, 0.8, 0.95], [0.2, 0.26, 0.42], nt);
    v4(sc[0], sc[1], sc[2], (this.dark ? 0.32 : 0.55) * (1 - 0.82 * nt));
    const paper = mixc(this.paper, [0.043, 0.055, 0.082], nt);
    this.clearCol = paper;
    v4(paper[0], paper[1], paper[2], this.dark || nt > 0.5 ? 1 : 0);
    const fl = mixc(this.dark ? [0.15, 0.145, 0.14] : [0.5, 0.47, 0.42], [0.1, 0.105, 0.115], nt);
    v4(fl[0], fl[1], fl[2], 0.8);
    const cur = (MIXES[core.pr.mixId] || MIXES[0]).albedo;
    v4(cur[0], cur[1], cur[2], p.roughSet);
    v4(p.wetDark, p.greenDark, p.roughWet, p.sheen);
    v4(p.soak[0], p.soak[1], p.soak[2], p.soakAmt);
    const clip = st.clip;
    v4(clip.p[0], clip.p[1], clip.p[2], clip.on ? 1 : 0);
    v4(clip.n[0], clip.n[1], clip.n[2], 0.0008);
    const nz = st.nozzle;
    v4(nz[0], nz[1], nz[2], Math.sqrt(core.pr.A0 / Math.PI));
    v4(st.sway[0], st.sway[1], st.sway[2], st.extruding ? 1 : 0);
    v4(-0.2, -0.22, 0.4, st.ringFrom || 0);   // heightfield origin and size; first ring to rebuild
    v4(this.showMesh ? 1 : 0, core.pr.count, this.size[0], this.size[1]);
    const f = core.flex;
    v4(f.center[0], f.center[1], f.center[2], 0.018);
    v4(f.x[0], f.x[1], f.x[2], f.active ? 1 : 0);
    v4(p.pin, p.mixVar, p.tint, this.dark ? 1.25 : 0.93);
    v4(st.dt, this.dustCursor, st.spawn, 0);
    v4(this.accent[0], this.accent[1], this.accent[2], 0);
    for (let k = 0; k < 4; k++) { const a = MIXES[k].albedo; v4(a[0], a[1], a[2], 0); }
    v4(nt, (st.lamp ? st.lamp.intensity : 0) * nt, st.fireflies ? 1 : 0, st.wall || 0);
    const lp = st.lamp ? st.lamp.pos : [0, 1, 0], lt = st.lamp ? st.lamp.target : [0, 0, 0];
    const ld = V3.norm(V3.sub(lt, lp));
    v4(lp[0], lp[1], lp[2], Math.cos(0.62));
    v4(ld[0], ld[1], ld[2], 0);
    v4(st.form ? st.form.clock : 99, st.form && st.form.on ? 1 : 0, 0, 0);
    v4(st.tower ? st.tower.clock : 99, st.tower && st.tower.on ? 1 : 0, 0, 0);
    v4(st.hail && st.hail.on ? 1 : 0, this.hailCursor, st.hail ? st.hail.spawn : 0, st.wallDt || 0);

    const zen = mixc(this.dark ? [0.075, 0.095, 0.17] : [0.53, 0.65, 0.82], [0.02, 0.026, 0.045], nt);
    const hor = mixc(this.dark ? [0.4, 0.28, 0.27] : [0.97, 0.85, 0.72], [0.055, 0.065, 0.1], nt);
    v4(zen[0], zen[1], zen[2], 0);
    v4(hor[0], hor[1], hor[2], (this.dark ? 0.6 : 1) * (1 - nt));
    v4(1.0, 0.6, 0.3, (this.dark ? 0.32 : 0.45) * (1 - nt));
    this.dev.queue.writeBuffer(this.uni, 0, u.buffer, 0, o * 4);
  }

  cutRuns(clip, count) {
    const pr = this.core.pr, L = pr.layerInfo, xz = pr.nodeXZ, lay = pr.nodeLayer;
    const [px, py, pz] = clip.p, [nx, ny, nz] = clip.n;
    const runs = [];
    let a = -1;
    for (let i = 0; i <= count; i++) {
      let near = false;
      if (i < count) {
        const li = L[lay[i]], y = li ? li.yCenter : 0;
        const d = (xz[i * 2] - px) * nx + (y - py) * ny + (xz[i * 2 + 1] - pz) * nz;
        near = Math.abs(d) < 0.02;
      }
      if (near && a < 0) a = Math.max(0, i - 1);
      if (!near && a >= 0) { runs.push([a, Math.min(i + 1, count + 1)]); a = -1; if (runs.length > 256) return null; }
    }
    return runs;
  }

  encode(enc, cam, st) {
    const core = this.core, sim = core.sim, count = core.pr.count;
    this.hailCursor = this.hailCursor || 0;
    const hailLive = !!(st.hail && st.hail.live);

    if (count < this.ringValid) { this.ringValid = 0; this.hfDirty = true; }
    const full = sim.restacked || core.flex.active || this.ringValid === 0;
    const ringFrom = full ? 0 : Math.max(0, Math.min(sim.activeStart - 6, this.ringValid));
    const hfDue = full || this.hfDirty || hailLive;
